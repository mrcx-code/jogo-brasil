# O PORTÃO ENTRE UM ERRO E O AR.
#
# `main` é produção: push nela publica sozinho na Vercel. Até aqui, nada rodava o teste antes
# disso — e o RETOMADA.md registra o dia em que alguém commitou com o teste vermelho porque o
# encadeamento seguiu adiante. Esta ação existe para que isso não dependa de ninguém lembrar.
#
# Roda o `npm test`, que é `npm run build && node test/smoke.js`: o build recusa escrever se o
# tsc falhar, e o smoke abre o jogo num Chromium de verdade e reprova erro de console, upgrade
# que não aplica, save adulterado que vaza, e a bateria do glossário.
name: teste

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # SEM cache do setup-node, e a ausência é a correção de um erro que esta ação já cometeu
      # na primeira versão: o cache EXIGE um arquivo de lock, e o package-lock.json está no
      # .gitignore deste projeto. A primeira execução morreu em 24 s com "Dependencies lock
      # file is not found". É a MESMA razão pela qual abaixo se usa npm install e não npm ci —
      # a armadilha é uma só e pega em dois lugares.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # npm install e não npm ci: o ci falharia por não achar o lock. Se um dia o lock passar a
      # ser versionado, troque os dois de uma vez (o install aqui e o cache acima), porque o ci
      # é reprodutível e o install não é.
      - run: npm install

      # ONDE O CHROMIUM ESTÁ — estático, ~40 ms, e vem ANTES do navegador de propósito: ele é o
      # único passo daqui que ainda funciona quando o navegador é o problema, e o valor dele é
      # justamente falhar rápido com a mensagem certa.
      #
      # ELE NASCEU DE UM DEFEITO MEDIDO EM 31/08. Dez portões que este arquivo roda lançavam o
      # Chromium NUS (`chromium.launch()`), enquanto o smoke e o encaixe passavam
      # `executablePath`. Aqui no runner isso nunca apareceu — o passo abaixo instala o
      # navegador e nu e vestido dão no mesmo. Numa máquina com o navegador PROVISIONADO numa
      # build diferente da que o Playwright espera, os dez morrem: `npm test` saía 1 pelo
      # `regua-larga.js` DEPOIS de o smoke imprimir "PASS", e morriam junto dois dos quatro
      # portões do ciclo do plantão e o `conteudo-espelho.js`, que é o portão do funil para
      # diff de glossário. A mensagem do Playwright manda instalar navegador — e o navegador
      # está no disco; o que falta é dizer onde.
      #
      # A lista de portões que ele cobra é DERIVADA deste YAML e do package.json, não escrita à
      # mão: portão novo entra na cobrança sozinho.
      - name: onde o Chromium está (nenhum portão lança nu)
        run: node test/portao-navegador.js
        timeout-minutes: 1

      # E O CONTROLE DELE, a lição 2.8 da casa: injeta um lançamento nu num portão real, exige
      # que a varredura MORDA, e restaura. Sem isto a varredura acima é decoração assinada de
      # verde — e decoração assinada de verde é pior que teste nenhum.
      - name: controle do portão do navegador (prova que ele morde)
        run: node test/portao-navegador.js --autoteste
        timeout-minutes: 1

      # O smoke test precisa de um navegador de verdade. --with-deps traz as bibliotecas de
      # sistema que o Chromium pede no runner do Ubuntu; sem elas ele instala e não abre.
      - run: npx playwright install --with-deps chromium

      # O teste imprime muita coisa e o valor está NA SAÍDA, não só no código de saída — é a
      # regra do CLAUDE.md §6, e vale para quem for ler o log aqui também.
      - run: npm test

      # O ENCAIXE TAMBEM (decisao do dono, 21/08 12:38 pelo dashboard): o CI cobria so metade
      # da lei (build+smoke) e um vermelho do encaixe ficou invisivel na main (PENDENTES 44).
      # Custa ~5 min por push; o dono aceitou o preco. Timeout largo: sao 395 asserçoes.
      - run: node test/encaixe.js
        timeout-minutes: 12

      # O CONTROLE DO FILTRO DE CONSOLE (31/08). O coletor de erros de console do encaixe passou
      # a calar UM host — o da medição — quando o navegador diz que não conseguiu buscá-lo, para
      # não reprovar um jogo perfeito por causa do proxy de quem roda. Filtro sem controle é
      # portão cego com assinatura de verde, e este quase ficou: a primeira versão engolia também
      # o 404 e o 400 VINDOS da medição, que são culpa do jogo (endereço malformado, payload
      # inválido) e são exatamente o modo de falha que o CLAUDE.md §3.2 chama de o pior, porque
      # já é silencioso por natureza. Quem achou foi o QA, contra o autor. As seis cenas rodam
      # no jogo de verdade, com a CSP de verdade, e a cena D injeta o defeito de volta.
      - name: controle do filtro de console (prova que ele só cala a rede de quem roda)
        run: node test/filtro-console-controle.js
        timeout-minutes: 4

      # E A FILA-AUTH (A11 da auditoria da seguranca, 21/08). O dashboard e a unica pagina que
      # guarda sessao do dono — access_token E refresh_token — e ate aqui nada no CI a abria:
      # quem quebrasse o login so descobriria tentando entrar pelo celular. As 13 cenas rodam
      # com o backend TODO simulado por page.route, entao nenhum pedido sai para o projeto de
      # verdade e nenhuma linha de teste entra na fila do dono. Sao ~40 s; o teto de 3 min e
      # para o job morrer rapido se um dia ele pendurar, em vez de queimar 6 horas de runner.
      - run: node test/fila-auth.js
        timeout-minutes: 3

      # E OS CAMINHOS DE "ACIONAR" (24/08). O dashboard oferecia ao dono uma lista ESCRITA A MAO
      # de 28 caminhos contra 15 itens `livre` no backlog — duas das opcoes ja estavam
      # `concluido`, e ele acionou dois agentes para trabalho pronto. Lista chumbada envelhece em
      # silencio: sem portao, ninguem descobre ate o agente chegar la e achar tudo feito. Sao
      # ~20 s, backend simulado por page.route, e a cena 6 e um MUTANTE que prova o portao
      # mordendo (licao 2.8).
      - run: node test/caminhos-do-backlog.js
        timeout-minutes: 3

      # AS FONTES CONFIAVEIS — o painel, a fila e a lei do continuo, cobrados a cada push (24/08).
      # O dono viu a mesa dizer '111 imagens a gerar' com 88 delas ja feitas e perguntou se
      # estavamos refazendo tudo. Nao estavamos: a mesa lia um disco de rascunho vazio em vez do
      # registro duravel. Estes quatro portoes garantem que a mesa e o painel nunca mais afirmem
      # em silencio o que nao sabem. conferir-agentes usa 0/1/2 (bate / nao bate / nao conferiu).
      - run: node test/conferir-mesa.js
        timeout-minutes: 2
      - run: node ferramentas/conferir-fila.js
        timeout-minutes: 2
      # O CONTRATO DO ITEM (02/09): a fila nao secar e uma pergunta; o que esta nela ser
      # DESPACHAVEL e outra. 9 dos 16 itens livres nao tinham aceite — o agente pegava sem
      # saber quando parar. O --controle roda 6 mutantes no proprio arquivo (licao 2.8).
      - run: node ferramentas/conferir-item.js
        timeout-minutes: 2
      - run: node ferramentas/conferir-item.js --controle
        timeout-minutes: 2
      - run: node ferramentas/conferir-agentes.js
        timeout-minutes: 2

      # O PORTAO QUE MORDIA E NINGUEM RODAVA (03/09, nuvem-20260903T0023). E a MESMA doenca que a
      # rodada de 02/09 curou tres vezes, reaparecida no portao que aquela rodada escreveu: o
      # qa-vercel-host.js nasceu bom — le o vercel.json DEPOIS do parse (nao por texto) e morde 5 de
      # 5 injecoes, onde o conferirVercelJson do build mordia 1 de 5 — e foi para o disco sem dono.
      # Medido aqui: grep por 'qa-vercel-host' no package.json e nos workflows dava ZERO. Ele
      # guardava o host do vercel.json, que decide o cabecalho servido nas paginas publicas, e
      # dependia de alguem digitar o comando numa main que publica sozinha no push.
      #
      # Fica NESTE job, e nao no `portoes`: ele nao abre navegador nem le `dist/` (so JSON.parse do
      # vercel.json), entao esperar o Chromium instalar seria atrasar o retorno de graca.
      - name: o host do vercel.json sai da constante (parse do JSON, nao do texto)
        run: node test/qa-vercel-host.js
        timeout-minutes: 2

      # O PONTO CEGO QUE OS DOIS PORTOES ACIMA COMPARTILHAM (03/09, achado do QA auditando a
      # entrega csp-host-constante). Nao e mais um portao de host: e o unico que nao herda o cego.
      #
      # O construir.js e o qa-vercel-host.js partem a CSP montando um OBJETO, entao leem a ULTIMA
      # ocorrencia de cada diretiva. O navegador faz o contrario: a CSP3 manda ignorar a diretiva
      # repetida e aplicar a PRIMEIRA — medido em Chromium com tres origens locais, a 1a passou e a
      # 2a foi bloqueada. Consequencia medida: um connect-src duplicado, com a PRIMEIRA apontando
      # para um host que nao tenha "posthog" no nome, atravessa os dois com exit 0, e a Vercel
      # serviria esse host nas paginas publicas. A duplicata com host do posthog so morde por
      # acidente, porque ai a contagem de "posthog" vai a 14.
      #
      # Por isso ele cobra FORMA e nao valor — nenhuma CSP do vercel.json repete diretiva nenhuma —
      # e vale igual para script-src e img-src.
      - name: nenhuma CSP do vercel.json repete diretiva (o navegador aplica a PRIMEIRA)
        run: node test/qa-vercel-diretiva-repetida.js
        timeout-minutes: 2

      # O ESPELHO DO CONTEUDO — INFORMATIVO POR ENQUANTO, E ISSO E DE PROPOSITO.
      #
      # A Avenida A fase 1 (22/08) poe o glossario do banco em arquivos versionados
      # (ferramentas/conteudo/*.json, escritos por `npm run conteudo:puxar`, que so roda a mao e
      # nunca dentro do build). Este passo compara esses arquivos com o glossario embutido no
      # jogo e sai 1 quando divergem.
      #
      # ELE NASCE VERMELHO, POR RAZAO CONHECIDA: o historiador revisou 6 verbetes no jogo em
      # 21/08 (GUARANI, YANOMAMI, TIKUNA, TRONCO LINGUISTICO, DESMATAMENTO, MAPBIOMAS) e o banco
      # ainda tem o texto anterior -- 8 divergencias em 6 chaves, listadas em
      # ferramentas/conteudo/DIVERGENCIA.md. Um portao que nasce vermelho por motivo conhecido
      # nao pode derrubar o CI de todo push: em uma semana ninguem olha mais o vermelho e o
      # proximo defeito de verdade passa despercebido junto.
      #
      # QUANDO TIRAR O `continue-on-error`, e o gatilho e objetivo: assim que o plantao aplicar
      # as rev+1 via MCP, o `npm run conteudo:conferir` sair 0 na main, e o
      # `node ferramentas/conteudo-puxar.js --conferir` confirmar que o disco esta em dia. Ai
      # este passo vira PORTAO -- e a partir dali toda revisao de texto historico tem de andar
      # nos dois lugares junto, que e a coisa inteira que a fase 1 existe para garantir.
      #
      # Roda depois do `npm test` porque ele le o `index.html` da RAIZ, que e saida do build.
      - name: diarios sem eco (o caso PENDENTES de 22-08)
        run: node test/diario-sem-eco.js
        timeout-minutes: 1

      - name: espelho do conteudo (PORTAO desde 22/08 — banco alcancou o jogo, hash unico)
        run: npm run conteudo:conferir
        timeout-minutes: 5


  # ------------------------------------------------------------------------------------
  # SEGUNDO JOB, e a razao e tempo de parede: o controle da fila-auth injeta 21 defeitos,
  # um por vez, e cada um custa ~38 s — treze minutos so ele. Somado ao smoke no MESMO job,
  # o CI passaria de quarenta minutos, e CI que ninguem espera e CI que ninguem le. Os dois
  # jobs rodam em runners diferentes, ao mesmo tempo: o smoke continua respondendo em ~6 min
  # e os portoes pesados terminam por conta deles.
  # ------------------------------------------------------------------------------------
  portoes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # o build primeiro: varios portoes leem o index.html da RAIZ, que e saida
      - run: npm run build

      # OS TRES PORTOES QUE NASCERAM NA RODADA DE 02/09 (nuvem-20260902T1623) E PRECISAVAM DE DONO.
      # A rodada inteira foi sobre controle que morde e ninguem roda — o item fonte-embutida-sem-portao
      # curou um caso e estes tres nasceriam com a MESMA doenca se ficassem so no disco. O QA cobrou
      # isto por escrito nos dois relatorios ("nasce com a doenca que a entrega 2 curou" e "portao de
      # seguranca que so roda se alguem digitar o comando nao protege uma main que publica sozinha").
      #
      # Ficam aqui, e nao no `npm test`, pelo motivo que o job inteiro existe: os tres leem `dist/`
      # ou abrem o Chromium, e este job ja instalou o navegador (linha 166) e ja construiu (linha 168).
      - name: CSP das paginas publicas (cobertura, tabela pregada, e o navegador)
        run: node test/csp-paginas.js
        timeout-minutes: 3

      # O IRMAO DELE, e a razao de serem DOIS: o de cima cobra a CSP; este cobra os outros tres
      # cabecalhos (XFO, nosniff, Referrer-Policy), que o de cima IMPRIMIA sem cobrar. Medido pelo QA
      # em 02/09, removendo um por vez do vercel.json: `csp-paginas.js` saia 0 nas tres remocoes.
      # Regra condicional de proposito (rota que tem CSP tem de ter os tres), para continuar
      # verdadeira quando uma rota nova entrar sem CSP.
      - name: cabecalhos que acompanham a CSP (XFO, nosniff, Referrer-Policy)
        run: node test/qa-csp-cabecalhos.js
        timeout-minutes: 2

      # A TERCEIRA RECEITA DA REGUA, pregada por exit code em vez de por comentario — porque a
      # explicacao dela ja foi escrita ERRADA duas vezes seguidas (02/09), e as duas passaram no
      # portao. Ele prega que `#poste` e `relative`, que `top` desloca de verdade, que quem resgata
      # e o `overflow-y`, e que o 2-de-6 e do eixo X.
      - name: poste fora do fluxo (a mecanica da terceira receita, com autoteste)
        run: node test/poste-fora-do-fluxo.js
        timeout-minutes: 3

      # OS PORTÕES QUE EXISTIAM E NÃO RODAVAM (23/08, pergunta do dono: "esse smoke que passa,
      # vale alguma outra camada de teste?").
      #
      # A resposta medida foi desconfortável: existiam 43 arquivos de teste no repositório e o
      # CI rodava CINCO. Tudo o que as rodadas de 21 e 22/08 construíram — o chrome da
      # plataforma, o portão que impede a porta de mentir, o papel de campo, a medição das
      # páginas e, o pior de todos, o CONTROLE da fila-auth — dependia de alguém lembrar de
      # rodar na própria máquina. Portão que depende de memória não é portão; é intenção.
      #
      # O CONTROLE é o que mais faltava, e a razão é a lição 2.8 da casa: `fila-auth.js` diz que
      # os consertos estão lá, e `fila-auth-controle.js` é quem prova que ele MORDE quando o
      # conserto some. Sem o controle no CI, o dia em que uma cena virar decoração ninguém
      # descobre — foi assim que duas cenas do guarda-lock passaram como decoração, e só o
      # controle pegou.
      #
      # Todos rodam headless com o mesmo Chromium do smoke e sem rede de verdade (page.route
      # intercepta o Supabase; os geradores servem de arquivo). Se algum se mostrar instável no
      # Linux, o conserto é o teste, não tirá-lo daqui.
      # ------------------------------------------------------------------------------------
      - name: controle da fila-auth (prova que as cenas MORDEM — a lição 2.8)
        run: node test/fila-auth-controle.js
        timeout-minutes: 20

      - name: a porta não pode mentir (número da porta x número da seção)
        run: node test/medir-porta-secao.js
        timeout-minutes: 4

      - name: chrome da plataforma (barra de tábuas, toque de 44px, zero fonte de rede)
        run: node test/medir-plataforma-chrome.js
        timeout-minutes: 6

      - name: papel de campo nas seções de leitura
        run: node test/medir-leitura-secao.js
        timeout-minutes: 5

      - name: medição das páginas (evento único, desligar desliga, adblock não quebra)
        run: node test/medir-paginas.js
        timeout-minutes: 6

      # O cartao-controle.js entrou DEPOIS do resto, e a espera foi de proposito. Rodado a mao
      # em 23/08 ele reprovou de verdade: os cartoes og:image das 3 secoes de leitura tinham
      # TRIPLICADO de peso (66/67/74 -> 183/180/183 KB, contra a regua de 90 do proprio item),
      # porque o papel de campo da onda 3 poe pauta e grao no fundo e JPEG odeia textura fina.
      # Portao que nasce vermelho por defeito REAL ensina a equipe a ignorar o CI, que e o
      # defeito que ele existe para curar. O conserto pousou (183 -> 82/82/85 KB, medido nos 9
      # cenarios), e so entao ele entra. Ele tambem carrega o proprio controle: injeta um
      # cartao gordo e exige que a medicao MORDA.
      - name: cartao de link (peso e forma do og:image, com controle)
        run: node test/cartao-controle.js
        timeout-minutes: 8

      # O CARTAO DE LINK NAO LEVA CONTROLE DENTRO DO QUADRO (item controle-cartao-sem-dono, 02/09).
      # Pendurado logo depois do passo de cima DE PROPOSITO, e nao por acaso: este job ja instalou
      # o Chromium (linha 166) e o passo acima ja e o dono do assunto "cartao de link" — nao vale a
      # pena um segundo job so para isto. E OUTRO ARQUIVO do que o de cima: aquele mede PESO/FORMA
      # do JPEG (og:image); este mede o que SOBRA DENTRO DO RECORTE 1200x630 (nenhum controle
      # interativo visivel numa foto que nao pode ser tocada), incluindo os 7 mutantes do CENSO
      # contra territorio/index.html commitado. Desde 23/08 e ate 02/09 ele so rodou a mao — o
      # PENDENTES 100 (o botao "MEDICAO / ligada" reaparecendo no cartao publicado) so foi pego
      # porque alguem lembrou de chama-lo manualmente. Nao le rede nem escreve nada: abre os 4
      # arquivos HTML commitados (historia/glossario/de-onde-vem/territorio) por um servidor local
      # proprio (test/abrir.js). Custo medido: ~31 s.
      - name: cartao de link — nenhum controle dentro do quadro (censo)
        run: node test/cartao-quadro-controle.js
        timeout-minutes: 2

      # O painel dizia "agora" sobre quatro cartoes cujo ultimo sinal tinha 315 minutos (01/09,
      # 10h44 — o dono viu antes de nos). Status nao e prova de vida: quem cai deixa a linha
      # acesa. Este portao cobra que o rotulo diga a IDADE do sinal, e carrega o controle que
      # prova que ele morde — a versao antiga da pagina TEM de reprovar nele.
      - name: o painel nao mente sobre sinal velho (com controle)
        run: node test/painel-sem-sinal.js
        timeout-minutes: 5

      # O Acionar dizia "Nao consegui ler a fila" ate a pessoa recarregar a pagina a mao (02/09,
      # o dono viu ao vivo): carregarBacklog() rodava uma vez, sem teto e sem retry. Este portao
      # cobra que ela tente de novo sozinha (com teto por AbortController, senao um fetch
      # pendurado nunca deixa o retry rodar) e que uma falha de refresh NUNCA apague uma fila que
      # ja estava correta na tela — com o controle: a versao antiga TEM de reprovar.
      - name: a fila do backlog fica conectada (com controle)
        run: node test/backlog-conectado.js
        timeout-minutes: 3

      - name: o lock entre máquinas (o guarda recusa território de outra máquina)
        run: node test/guarda-lock.js
        timeout-minutes: 2

      # OS DOIS PORTÕES DE MÃO ENTRAM NO CI (31/08) — fecha o PENDENTES 73.
      #
      # O item está aberto desde 23/08 e o custo dele foi medido lá: a `main` carregou **dois
      # portões em contradição direta sobre a mesma entrada** (`salvoEm: 5e12`) por **nove dias**,
      # e ninguém tropeçou porque nenhum dos dois rodava sozinho. O item dizia que acrescentá-los
      # é barato, **com uma condição**: conferir antes se são estáveis, porque o `robusto-tudo`
      # depende do save semeado e o `PENDENTES 71` mostrava a semente sendo apagada a cada 10 s.
      #
      # A CONDIÇÃO ESTÁ CUMPRIDA, e por medição: o 71 foi verificado em 31/08 (o
      # `setInterval(() => salvar(), …)` já está no produto, e a regressão injetada de volta
      # reproduz a sobrescrita aos 10 s no segundo exato). E a estabilidade foi medida aqui, com a
      # máquina sob carga de quatro agentes: `robusto-tudo` **3 de 3 verdes**, 18 s · 17 s · 17 s;
      # `medir-save-hostil` verde em duas execuções do ciclo completo, ~5 s.
      #
      # E há um motivo novo, que é o que tirou o item da fila: a cena **3c** do `robusto-tudo` —
      # a ÚNICA linha de teste no caminho da aba oculta, escrita em 31/08 — rodava em **zero**
      # lugares automáticos. Asserção que só existe se alguém digitar não guarda nada.
      - name: robusto-tudo (os seis maus-tratos, e a cena 3c da aba oculta)
        run: node test/robusto-tudo.js
        timeout-minutes: 5

      - name: save hostil (entrada não confiável não envenena o estado)
        run: node test/medir-save-hostil.js
        timeout-minutes: 4
