<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa · subir imagem</title>
<style>
  :root{ --papel:#f3eee2; --tinta:#1d2119; --mata:#2f5230; --terra:#7a4a24; --linha:#d3cab5; --pedra:#7d8479; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font:400 17px/1.5 Georgia,serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .cx{max-width:34rem;width:100%;text-align:center}
  h1{font-size:1.6rem;margin:0 0 .3rem}
  p{color:var(--pedra);margin:.2rem 0 1.2rem;font-size:.95rem}
  #alvo{border:3px dashed var(--terra);border-radius:12px;padding:3rem 1.5rem;background:#fff8;
    transition:border-color .15s,background .15s;cursor:pointer}
  #alvo.sobre{border-color:var(--mata);background:#e9f0e6}
  #alvo b{display:block;font-size:1.1rem;margin-bottom:.3rem}
  #nome{margin-top:1rem;width:100%;padding:.55rem .7rem;font:inherit;border:2px solid var(--linha);border-radius:8px}
  #saida{margin-top:1rem;font:600 .85rem/1.5 ui-monospace,monospace;color:var(--mata);min-height:1.4em;word-break:break-all}
  #saida.erro{color:#a33}
  ul{margin:1.2rem 0 0;padding:0;list-style:none;font:600 .78rem/1.7 ui-monospace,monospace;color:var(--pedra);text-align:left}
</style>
</head>
<body>
<div class="cx">
  <h1>Mesa</h1>
  <p>Cole (Ctrl+V) ou arraste a imagem. Ela cai em <code>assets/entrada/</code> e o resto é comigo.</p>
  <div id="alvo" tabindex="0"><b>Cole ou solte a imagem aqui</b><span>png · jpeg · webp</span></div>
  <input id="nome" placeholder="nome do arquivo (opcional — ex.: cap5-mercado)">
  <div id="saida"></div>
  <ul id="lista"></ul>
</div>
<script>
(function(){
  "use strict";
  var alvo=document.getElementById("alvo"), saida=document.getElementById("saida"),
      nome=document.getElementById("nome"), lista=document.getElementById("lista");
  function diz(t,erro){ saida.textContent=t; saida.className=erro?"erro":""; }
  function sobe(blob){
    if(!blob || !/^image\/(png|jpeg|webp)$/.test(blob.type)){ diz("isso não é png/jpeg/webp", true); return; }
    var fr=new FileReader();
    fr.onload=function(){
      diz("subindo…");
      fetch("/salvar",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({nome:nome.value||("colada-"+Date.now()), dataUri:fr.result})})
        .then(function(r){ return r.json().catch(function(){ throw new Error("resposta inválida"); }); })
        .then(function(j){
          if(!j.ok) throw new Error(j.erro||"falhou");
          diz("✓ salvo: "+j.arquivo+" ("+Math.round(j.bytes/1024)+" KB)");
          var li=document.createElement("li"); li.textContent="✓ "+j.arquivo; lista.prepend(li);
          nome.value="";
        })
        .catch(function(e){ diz("erro: "+e.message, true); });
    };
    fr.readAsDataURL(blob);
  }
  document.addEventListener("paste",function(e){
    var its=(e.clipboardData||{}).items||[];
    for(var i=0;i<its.length;i++) if(its[i].type.indexOf("image/")===0){ sobe(its[i].getAsFile()); return; }
    diz("não veio imagem no colar", true);
  });
  ["dragover","dragenter"].forEach(function(ev){ alvo.addEventListener(ev,function(e){ e.preventDefault(); alvo.classList.add("sobre"); }); });
  ["dragleave","drop"].forEach(function(ev){ alvo.addEventListener(ev,function(e){ e.preventDefault(); alvo.classList.remove("sobre"); }); });
  alvo.addEventListener("drop",function(e){ var f=(e.dataTransfer||{}).files||[]; if(f[0]) sobe(f[0]); });
})();
</script>
</body>
</html>
