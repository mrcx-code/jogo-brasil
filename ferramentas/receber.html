<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A mesa · BRASIL</title>
<style>
  /* A MESA FALA A LINGUA DO JOGO — a linguagem visual não mudou: madeira = coisa posta no
     lugar, pedra = ferramenta, e um ouro só, para o que importa agora. O que mudou em 10/08
     foi a QUANTIDADE de coisa e a ORDEM, em três correções do dono no mesmo dia:
       · "prefiro só o que tá pendente e boas. Tem coisa repetida também, evite isso."
       · "a sessão subir imagem pode sair, e a 'o que gerar' deve vir logo depois do revisar"
       · "quero a 'O que gerar' e 'O que decidir' sempre no topo, para resolver pendências"
     A página abre nas DUAS LISTAS. Tudo que não é "faça isto" nem "decida isto" desceu para
     o fim: o painel de atividade e a contagem do que está comigo. */
  /* ===================================================================
     A ESCALA DE TEXTO, REFEITA EM 10/08. O dono: "a mesa tá tão pequena, não consigo ler".
     Não era impressão: varri os `font-size` computados de todo elemento-folha visível e a
     mesa tinha 79 de 93 ABAIXO de 14 px, e nada acima de 15.

     A CAUSA: ela nasceu com a escala do JOGO, e o jogo é calibrado para um telefone na mão,
     a uns 30 cm, com densidade de pixel dobrada. A mesa é lida num monitor, a 60 cm, sem
     ampliação nenhuma. O mesmo número de pixels é confortável num caso e ilegível no outro —
     copiar a escala de um para o outro foi o erro.

     A RÉGUA, e ela vale para qualquer coisa que entrar aqui depois:
       · corpo de leitura (pergunta, prompt, descrição) ....... 17 px
       · rótulo, nome de arquivo, data, selo .................. 15–16 px
       · título das duas listas .............................. 21 px
       · NADA abaixo de 14 px, em lugar nenhum.
     (A fonte bitmap 5×7 do jogo, que só amplia por número inteiro, NÃO existe nesta página —
     a mesa é toda Cascadia Mono. Aqui não há degrau inteiro a respeitar.)

     O EFEITO COLATERAL FOI PAGO COM RESPIRO, NUNCA COM PALAVRA: texto maior estica o cartão,
     e o cartão precisa continuar cabendo inteiro numa tela de 800. O que encolheu foi
     entrelinha de rótulo, `padding` do cartão e da área de colar, e o espaçamento entre
     letras dos títulos — nenhum texto foi cortado nem abreviado. */
  :root { color-scheme: dark;
    --fundo:#1c2010; --painel:#2b3320; --painel2:#3c4627; --borda:#14170c;
    --texto:#f2e8ce; --sub:#a9a184; --ouro:#eba748; --papel:#e9d8ae; --tinta:#33240f;
    --good:#7d9a3c; --run:#71a39c; }
  body { margin: 0; padding: 14px 22px 24px; background: var(--fundo); color: var(--texto);
         font: 17px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; }
  /* A BARRA DO TOPO É FINA DE PROPÓSITO. O REVISAR é um botão, não uma seção: ele existe
     para recontar a fila, não para ser lido. Título, botão e placar cabem numa faixa só,
     e a primeira lista começa logo abaixo — o critério do dono é que a primeira coisa que
     ele vê ao abrir seja uma coisa que ele pode RESOLVER agora. */
  .barra { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
           border-bottom: 2px solid var(--borda); padding-bottom: 9px; margin-bottom: 4px; }
  .barra h1 { font-size: 19px; margin: 0; letter-spacing: .18em; color: var(--ouro);
       text-shadow: 0 2px 0 var(--borda); flex: 0 0 auto; }
  .barra button { margin: 0; padding: 5px 13px; font-size: 15px; }
  .barra .placar { color: var(--sub); font-size: 16px; flex: 1 1 auto; }
  .sub { color: var(--sub); font-size: 16px; }
  .bloco { background: var(--painel); border: 2px solid var(--borda);
    box-shadow: 0 4px 0 var(--borda); padding: 14px 16px; }
  .bloco h2 { font-size: 16px; letter-spacing: .16em; color: var(--sub);
    margin: 0 0 9px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .linha { display: flex; gap: 12px; padding: 5px 0; align-items: baseline; font-size: 16px; }
  .linha + .linha { border-top: 1px solid rgba(20,23,12,.35); }
  .marca { color: var(--sub); font-size: 15px; min-width: 108px; flex: 0 0 auto; }
  .selo { font-size: 14px; letter-spacing: .08em; padding: 1px 8px; border: 2px solid var(--borda);
    box-shadow: 2px 2px 0 var(--borda); flex: 0 0 auto; margin-left: auto; }
  .sVoo { background: var(--run); color: #101b19; animation: pulsa 1.6s ease-in-out infinite; }
  .sFeito { background: var(--good); color: #141b08; }
  /* PARADO É UM ESTADO, e ele tem selo próprio de propósito: apagado, sem pulso, sem ouro.
     O painel só grita quando há o que gritar — senão "trabalhando" perde o significado. */
  .sParado { background: var(--painel2); color: var(--sub); }
  .sFrio { background: #4a3a1a; color: #ffcd75; }
  @keyframes pulsa { 50% { opacity: .5 } }
  @media (prefers-reduced-motion: reduce) { .sVoo { animation: none } }
  /* O TÍTULO DAS DUAS LISTAS É O MAIOR TEXTO DA PÁGINA, e é o único lugar onde tamanho vale
     por si: ele separa as seções de longe, sem que ninguém precise ler. */
  .secao { font-size: 21px; letter-spacing: .12em; color: var(--texto); margin: 24px 0 9px;
    text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
  .secao.primeira { margin-top: 12px; }   /* a lista de cima cola na barra: nada rouba o topo */
  .conta { font-size: 14px; letter-spacing: .08em; padding: 2px 8px;
    border: 2px solid var(--borda); box-shadow: 2px 2px 0 var(--borda);
    background: var(--ouro); color: #221a06; }
  .conta:empty { display: none; }
  /* O `padding` do cartão e o da área de colar são o RESPIRO que pagou o texto maior: 16 -> 13
     e 18 -> 12. Nenhuma palavra saiu para o cartão continuar cabendo inteiro numa tela de 800. */
  .pedido { border: 2px solid var(--borda); padding: 13px 14px; margin-bottom: 14px;
            background: var(--painel); box-shadow: 0 4px 0 var(--borda); }
  /* Piscada de ouro quando o Ctrl+V da página inteira escolhe este cartão: sem ela, colar
     fora do campo parece não ter acontecido — ou pior, ter acontecido no pedido errado. */
  .pedido.recebeu { outline: 3px solid var(--ouro); outline-offset: 2px; }
  .titulo { font-weight: 600; font-size: 19px; margin-bottom: 3px; line-height: 1.35; }
  .ref { color: #a09c92; font-size: 15px; margin-bottom: 8px; line-height: 1.4; }
  /* O PROMPT VEM DOBRADO. O dono pediu "o prompt pronto para copiar em um toque" — quem
     copia não precisa ler, e um quadro de texto por cartão era metade da altura da página.
     O botão de copiar é a ação principal; o texto abre por baixo para quem quiser conferir. */
  details.dobra { margin: 0 0 9px; }
  details.dobra > summary { cursor: pointer; color: var(--sub); font-size: 16px;
    letter-spacing: .04em; list-style: none; padding: 3px 0; }
  details.dobra > summary::-webkit-details-marker { display: none; }
  details.dobra > summary::before { content: "▸ "; }
  details.dobra[open] > summary::before { content: "▾ "; }
  .prompt { background: #101218; border: 1px solid #2c3038; border-radius: 6px; padding: 10px;
            font: 17px/1.45 ui-monospace, monospace; color: #c3d4b3; white-space: pre-wrap;
            max-height: 320px; overflow: auto; }
  .cola { border: 2px dashed #3a4049; border-radius: 6px; padding: 12px; text-align: center;
          color: #a09c92; cursor: text; outline: none; font-size: 17px; }
  .cola:focus { border-color: #6fdd94; color: #c3d4b3; }
  .cola.tem { border-style: solid; border-color: var(--good); padding: 8px; }
  /* arrastando por cima: o alvo acende, para o dedo saber onde soltar */
  .cola.sobre { border-style: solid; border-color: var(--ouro); background: rgba(235,167,72,.10);
                color: var(--ouro); }
  .cola img { max-width: 100%; max-height: 260px; display: block; margin: 0 auto; }
  .estado { font-size: 16px; margin-top: 7px; min-height: 20px; }
  .ok { color: #6fdd94; } .erro { color: #e0603a; }
  button { background: var(--ouro); color: #221a06; border: 2px solid var(--borda);
           box-shadow: 0 3px 0 var(--borda); padding: 8px 16px;
           font: 600 16px system-ui; cursor: pointer; margin-top: 9px; }
  button:disabled { background: #2c3038; color: #6b6862; cursor: default; }
  button.secundario { background: #2c3038; color: #e0ddd4; margin: 0 0 9px; padding: 6px 13px;
                      font-size: 15px; }
  .vazio { color: #a09c92; font-size: 17px; }
  .rodape { color: var(--sub); font-size: 15px; margin: 10px 0 0; letter-spacing: .02em; }
  .divisa { border: 0; border-top: 1px solid rgba(20,23,12,.55); margin: 14px 0 10px; }
  /* UMA LINHA POR COMMIT. Um assunto de vinte palavras quebrava em seis linhas e um único
     commit ocupava mais altura que os quatro arquivos abertos acima dele — o painel dizia
     "trabalhando agora" e mostrava um parágrafo de ontem. `min-width: 0` é obrigatório: sem
     ele o filho flex não encolhe abaixo do conteúdo e o corte nunca acontece. */
  .assunto { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; }
  /* A LINHA DO QUE ESTÁ COMIGO. Era um bloco com 12 nomes; virou contagem, e desceu para o
     fim junto com o resto — lista o que está na MINHA mão, não na dele. */
  #comigo { color: var(--sub); font-size: 16px; margin: 14px 0 0; }
  /* PERGUNTAS: o que está parado esperando ele decidir. */
  .anexoCx { background: #12151b; border: 1px solid #2c3038; border-radius: 6px;
    padding: 10px; margin: 10px 0; }
  .anexoT { font-size: 15px; color: #f0c368; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase; margin-bottom: 8px; }
  .anexoIm { display: block; width: 100%; height: auto; image-rendering: pixelated;
    background: #ff00ff22; border-radius: 4px; }
  .anexoBt { display: inline-block; margin-top: 8px; text-decoration: none; }
  .rmItem { background: #191c23; border: 1px solid #2c3038; border-radius: 6px;
            padding: 8px 12px; margin-bottom: 6px; }
  /* O TÍTULO DE CADA PERGUNTA JÁ É A PERGUNTA, então ele é o que fica à vista e o corpo
     dobra atrás dele. Doze perguntas abertas davam 4.159 px de rolagem — mais que as duas
     outras seções somadas, e ninguém decide doze coisas de uma vez. Dobrado, ele vê a lista
     inteira de uma olhada e abre a que vai responder. */
  .rmT { font-size: 17px; color: #f0eee7; font-weight: 600; cursor: pointer;
         list-style: none; padding: 2px 0; line-height: 1.35; }
  .rmT::-webkit-details-marker { display: none; }
  /* A SETA SÓ EM QUEM ABRE. A caixa de recusa dentro do cartão reaproveita `.rmT` para ter o
     mesmo peso de título, mas ela não dobra — e com o texto maior a seta virou uma promessa
     visível de um clique que não existe. Escopo em `summary` e o problema some. */
  summary.rmT::before { content: "▸ "; color: var(--sub); }
  details[open] > summary.rmT::before { content: "▾ "; }
  .rmT { cursor: default; }
  summary.rmT { cursor: pointer; }
  /* O corpo da pergunta é o texto mais LIDO da mesa: é o que ele precisa entender para
     decidir. Fica em 17 px e num cinza mais claro que o de antes — contraste e tamanho são
     a mesma queixa vista de dois lados. */
  .rmN { font-size: 17px; color: #a8a49a; margin-top: 6px; line-height: 1.55; white-space: pre-wrap; }
  .rmResp { width: 100%; box-sizing: border-box; margin-top: 9px; padding: 9px 11px;
    background: #101218; border: 1px solid #2c3038; border-radius: 5px; color: #e8e6df;
    font: 17px/1.5 system-ui, sans-serif; resize: vertical; min-height: 44px; }
  .rmResp:focus { outline: none; border-color: #6fdd94; }
</style>
</head>
<body>

<!-- A BARRA. Título, o botão REVISAR e o placar numa faixa só. O que já foi seção e saiu:
     o bloco global de SUBIR IMAGEM, retirado a pedido do dono em 10/08. Ele era um SEGUNDO
     jeito de fazer o que o campo de cada cartão já faz — e as cinco entregas daquela tarde
     (cap2-corrida, cap4-fundo-chao-v2, q-p22, cap3-corrida, cap4-fundo-alto-v2) foram todas
     pelo campo do cartão: os .txt de `assets/entrada` registram "mesa · campo do pedido" nas
     cinco. O Ctrl+V da página inteira NÃO se perdeu junto: ele agora entrega ao cartão em
     que ele tocou por último (veja `cartaoParaColar`). -->
<div class="barra">
  <h1>A MESA</h1>
  <button id="btRevisar">REVISAR</button>
  <span class="placar" id="revisarPlacar">lendo a fila…</span>
</div>

<h2 class="secao primeira">O que gerar <span class="conta" id="quantasFaltam"></span></h2>
<div id="lista"><p class="vazio">carregando…</p></div>

<!-- O QUE DECIDIR saiu em 21/08: decisões moraram para o DASHBOARD (matheusferreira.cc/dashboard). -->

<h2 class="secao">Backlog <span class="conta" id="quantasBacklog"></span>
  <button id="confirmar-prioridades" style="margin:0;padding:5px 14px;font-size:15px">✓ Confirmar prioridades — avisa o Claude</button>
  <span id="conf-estado" class="sub" style="font-size:14px"></span></h2>
<p class="sub" style="margin:0 0 10px">A fila oficial, priorizada pela pm — <b>reordene com ▲▼</b>: a ordem daqui é o input de todos os agentes. O de cima é o próximo.</p>
<div id="backlog"><p class="vazio">carregando…</p></div>

<h2 class="secao">Atividades</h2>
<div id="rolando" style="margin-bottom:10px"><p class="vazio">carregando…</p></div>
<div id="ult24"></div>
<p id="comigo"></p>

<script>
// A página é burra de propósito: lê o que o servidor calculou, recebe uma colagem, e manda o
// data-uri para ele gravar. Nada além disso. Quem cruza manifesto, disco e registro é o
// servidor, em /fila — a página não remonta estado nenhum.
const lista = document.getElementById("lista");

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;   // textContent, nunca innerHTML
  return e;
}

// =========================================================================
// LISTA 1 — O QUE GERAR. Primeira coisa da página, por decisão do dono ("quero a 'O que
// gerar' e 'O que decidir' sempre no topo, para resolver pendências").
//
// Lê /fila, que é o ÚNICO lugar onde o cruzamento acontece: manifesto contra registro do que
// entrou no jogo, contra recusas, contra o que há em disco. A ORDEM é a de aparição no jogo e
// vem pronta do servidor, que a deriva de EPOCAS no src/jogo.ts — nada de ordenar por número
// de nome, que poria o capítulo do presente (cap3) antes de SALVADOR (cap4), ou seja, antes
// do que ele mesmo comenta.
let ultimaContagem = -1;
let cartaoAlvo = null;      // o último cartão em que ele tocou; é para lá que o Ctrl+V vai

function montarFila() {
  return fetch("/fila").then(r => r.json()).then(function (fila) {
  lista.textContent = "";
  cartaoAlvo = null;
  const c = fila.contagem || {};
  ultimaContagem = c.gerar;
  const placar = document.getElementById("revisarPlacar");
  if (placar) placar.textContent = c.gerar + " para você gerar · " + c.pronto + " já estão no jogo";
  // O QUE ESTÁ COMIGO, EM UMA LINHA, NO FIM DA PÁGINA. Era um bloco com um nome por linha; o
  // dono: "prefiro só o que tá pendente". Ele precisa saber que existe — não ler. A contagem
  // SOMA as soltas (o que chegou sem estar no manifesto), senão o número da tela não fecha
  // com o do console.
  const comigo = document.getElementById("comigo");
  if (comigo) {
    const n = (c.chegou || 0) + (c.soltas || 0);
    comigo.textContent = n
      ? n + (n === 1 ? " imagem já chegou e está comigo, esperando entrar no jogo"
                     : " imagens já chegaram e estão comigo, esperando entrar no jogo")
      : "nada esperando do meu lado";
  }
  const pedidos = (fila.itens || []).filter(function (i) { return i.estado === "gerar"; });
  document.getElementById("quantasFaltam").textContent = pedidos.length ? pedidos.length + " FALTANDO" : "";
  if (!pedidos.length) {
    lista.appendChild(el("p", "vazio",
      "Nada para gerar agora. Quando eu escrever um pedido novo em " +
      "ferramentas/necessario.json, ele aparece aqui sozinho."));
    return;
  }
  pedidos.forEach(function (p) {
    const cx = el("div", "pedido");
    cx.appendChild(el("div", "titulo", p.titulo || p.nome));
    // O NOME DO ARQUIVO QUE ELE ESPERA RECEBER. A mesa salva com este nome sozinha ao colar,
    // mas quem gera fora precisa saber qual é — é a chave que liga tudo.
    cx.appendChild(el("div", "ref", "→ " + p.arquivoEsperado + "  ·  " + (p.onde || "")));
    cx.appendChild(el("div", "ref", (p.referencia || "") + (p.tamanho ? " · " + p.tamanho : "")));
    // O MOTIVO DA RECUSA SAIU DAQUI (15/08), e é a segunda vez que o dono pede: a mesa é onde
    // ele GERA, e ali o texto de recusa é parede. Ele chega a três parágrafos, empurra o botão
    // COPIAR PROMPT para fora da tela e gasta a atenção no problema que já acabou.
    // O motivo continua existindo inteiro em `recusadas.json`, que é o registro — e é de lá que
    // o `encaixe.js` bloco 31 cobra que ninguém deixe uma peça refeita esperando em silêncio.
    // O que fica no cartão é uma linha: que ela VOLTOU, para o pedido reaparecido não ler como
    // defeito da mesa. O porquê já está dentro do prompt, escrito como instrução do que fazer —
    // que é a forma que serve a quem vai gerar.
    if (p.recusa) cx.appendChild(el("div", "ref", "↺ pedido refeito"));
    // O ANEXO NA TELA, e nao so citado no texto (15/08). Um pedido que manda anexar uma imagem
    // e nao a mostra obriga quem gera a sair da mesa, achar o arquivo e voltar — e foi isso que
    // fez as folhas de corrida serem geradas quatro vezes a partir de descricao, sem referencia
    // nenhuma. A imagem fica ANTES do prompt de proposito: e a primeira coisa a levar junto.
    if (p.anexo) {
      const cx2 = el("div", "anexoCx");
      cx2.appendChild(el("div", "anexoT", "ANEXE ESTA IMAGEM junto do prompt"));
      const im = document.createElement("img");
      im.className = "anexoIm"; im.src = "/anexo/" + encodeURIComponent(p.anexo);
      im.alt = "imagem de referencia: " + p.anexo;
      cx2.appendChild(im);
      const ba = document.createElement("a");
      ba.className = "secundario anexoBt"; ba.href = "/anexo/" + encodeURIComponent(p.anexo);
      ba.download = p.anexo; ba.textContent = "BAIXAR " + p.anexo;
      cx2.appendChild(ba);
      cx.appendChild(cx2);
    }
    if (p.prompt) {
      // COPIAR EM UM TOQUE é a ação principal; o texto fica dobrado atrás dela.
      const bc = el("button", "secundario", "COPIAR PROMPT");
      bc.addEventListener("click", function () {
        navigator.clipboard.writeText(p.prompt)
          .then(function () { bc.textContent = "copiado ✓";
            setTimeout(function () { bc.textContent = "COPIAR PROMPT"; }, 2000); })
          .catch(function () { bc.textContent = "abra o prompt abaixo e copie à mão"; });
      });
      cx.appendChild(bc);
      const d = document.createElement("details");
      d.className = "dobra";
      const s = document.createElement("summary");
      s.textContent = "ver o prompt";
      d.appendChild(s);
      d.appendChild(el("div", "prompt", p.prompt));
      cx.appendChild(d);
    }

    const alvo = el("div", "cola", "cole aqui (Ctrl+V) ou ARRASTE a imagem para cá");
    alvo.tabIndex = 0;
    const estado = el("div", "estado");
    const botao = el("button", null, "Salvar");
    botao.disabled = true;
    let dados = null;

    // Colar e arrastar entregam a MESMA coisa — um File — então há um caminho só. Duplicar o
    // código seria a receita para os dois comportamentos divergirem na primeira correção.
    function receber(arq) {
      if (!arq || !arq.type || arq.type.indexOf("image/") !== 0) {
        estado.className = "estado erro";
        estado.textContent = "isso não é uma imagem — arraste um png, jpg ou webp";
        return;
      }
      const fr = new FileReader();
      fr.onload = function () {
        dados = fr.result;
        alvo.textContent = "";
        alvo.className = "cola tem";
        const img = new Image();
        img.onload = function () {
          estado.className = "estado";
          estado.textContent = img.naturalWidth + " × " + img.naturalHeight + " px · pronta para salvar";
        };
        img.src = dados;
        alvo.appendChild(img);
        botao.disabled = false;
      };
      fr.readAsDataURL(arq);
    }
    // O cartão publica o próprio `receber` para o Ctrl+V da página inteira poder entregar
    // aqui sem duplicar uma linha de leitura de arquivo.
    cx._receber = receber;
    // Tocar em qualquer lugar do cartão o elege como destino da próxima colagem solta.
    cx.addEventListener("mousedown", function () { cartaoAlvo = cx; });

    // ARRASTAR. O preventDefault no dragover é obrigatório: sem ele o navegador ABRE a imagem
    // numa aba e a mesa some da tela.
    ["dragenter", "dragover"].forEach(function (n) {
      alvo.addEventListener(n, function (ev) { ev.preventDefault(); ev.stopPropagation();
        alvo.classList.add("sobre"); });
    });
    ["dragleave", "drop"].forEach(function (n) {
      alvo.addEventListener(n, function (ev) { ev.preventDefault(); ev.stopPropagation();
        alvo.classList.remove("sobre"); });
    });
    alvo.addEventListener("drop", function (ev) {
      const dt = ev.dataTransfer;
      if (!dt) return;
      cartaoAlvo = cx;
      // arquivo do disco vem em .files; imagem arrastada de OUTRA ABA vem como item
      if (dt.files && dt.files.length) { receber(dt.files[0]); return; }
      for (const it of dt.items || []) {
        if (it.kind === "file" && it.type.indexOf("image/") === 0) { receber(it.getAsFile()); return; }
      }
      estado.className = "estado erro";
      estado.textContent = "não veio arquivo nenhum — tente arrastar do explorador de arquivos";
    });

    alvo.addEventListener("paste", function (ev) {
      const itens = (ev.clipboardData || {}).items || [];
      for (const it of itens) {
        if (it.type && it.type.indexOf("image/") === 0) {
          ev.preventDefault();
          cartaoAlvo = cx;
          receber(it.getAsFile());
          return;
        }
      }
      estado.className = "estado erro";
      estado.textContent = "não vi imagem na área de transferência — copie a imagem, não o link";
    });

    botao.addEventListener("click", function () {
      if (!dados) return;
      botao.disabled = true;
      estado.className = "estado";
      estado.textContent = "salvando…";
      fetch("/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome: p.nome, pedido: p.titulo || p.nome, origem: "mesa · campo do pedido", dados: dados })
      }).then(r => r.json().then(j => ({ ok: r.ok, j: j }))).then(function (r) {
        if (!r.ok || !r.j.ok) throw new Error("recusado");
        // O ITEM SAI DA LISTA NA HORA: o arquivo em disco passou a ser mais novo que a recusa,
        // então o servidor já o classifica como CHEGOU — e a linha do "está comigo" o pega.
        montarFila(); pintarAtividade();
      }).catch(function () {
        estado.className = "estado erro";
        estado.textContent = "falhou ao salvar";
        botao.disabled = false;
      });
    });

    cx.appendChild(alvo);
    cx.appendChild(estado);
    cx.appendChild(botao);
    lista.appendChild(cx);
  });
  }).catch(function () {
    lista.textContent = "";
    lista.appendChild(el("p", "vazio", "o servidor não respondeu — rode: node ferramentas/receber.js"));
  });
}
montarFila();

// =========================================================================
// LISTA 2 — O QUE DECIDIR. As perguntas que só ele responde.
function montarPendencias() { return; // dashboard cuida disso desde 21/08
  fetch("/pendencias").then(r => r.json()).then(function (pd) {
    const box = document.getElementById("pendencias");
    const conta = document.getElementById("quantasPerguntas");
    box.textContent = "";
    // SÓ O QUE AINDA NÃO FOI RESPONDIDO. Item respondido deixou de ser pendência e virou
    // trabalho MEU — mantê-lo aqui faz a lista só crescer, e lista que só cresce ninguém lê.
    const abertos = ((pd && pd.itens) || []).filter(function (i) { return !String(i.resposta || "").trim(); });
    conta.textContent = abertos.length ? abertos.length + " ESPERANDO" : "";
    if (!abertos.length) {
      box.appendChild(el("p", "vazio", "Nada esperando você aqui — tudo que eu precisava foi respondido."));
      return;
    }
    abertos.forEach(function (i) {
      const it = el("div", "rmItem");
      const d = document.createElement("details");
      const s = document.createElement("summary");
      s.className = "rmT";
      s.textContent = i.t;
      d.appendChild(s);
      if (i.n) d.appendChild(el("div", "rmN", i.n));
      it.appendChild(d);
      // Campo de resposta: ele escreve aqui e eu leio no arquivo. Mais confiável que o chat,
      // porque não se perde no rolar — e fica junto da pergunta que respondeu.
      const ta = document.createElement("textarea");
      ta.className = "rmResp";
      ta.placeholder = "sua resposta…";
      ta.value = i.resposta || "";
      // ENVIAR é explícito. Antes, o "change" do textarea disparava ao sair do campo — ele
      // nunca sabia se tinha enviado, e um clique fora mandava resposta pela metade.
      const env = document.createElement("button");
      env.textContent = "ENVIAR RESPOSTA";
      env.disabled = true;
      ta.addEventListener("input", function () { env.disabled = !ta.value.trim(); });
      const mandar = function () {
        if (!ta.value.trim()) return;
        env.disabled = true; env.textContent = "enviando…";
        fetch("/responder", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ t: i.t, resposta: ta.value }) })
          .then(function (r) { return r.json(); })
          .then(function () {
            // Sai da tela deslizando, para o gesto ter consequência visível: respondeu, sumiu.
            it.style.transition = "opacity .35s, transform .35s";
            it.style.opacity = "0"; it.style.transform = "translateX(18px)";
            setTimeout(montarPendencias, 380);
          })
          .catch(function () { env.disabled = false; env.textContent = "ENVIAR RESPOSTA"; });
      };
      env.addEventListener("click", mandar);
      // Ctrl+Enter manda sem tirar a mão do teclado.
      ta.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); mandar(); }
      });
      // A RESPOSTA MORA DENTRO DA DOBRA, junto da pergunta que ela responde. Doze campos de
      // resposta abertos ao mesmo tempo davam 2.046 px de caixa vazia — e ninguém responde
      // uma pergunta sem ter lido. Fechado, cada pendência é UMA LINHA: a lista inteira cabe
      // de uma olhada, que é o que ele pediu ao dizer "prefiro só o que tá pendente".
      d.appendChild(ta);
      d.appendChild(env);
      box.appendChild(it);
    });
  }).catch(function () {});
}
montarPendencias();

// ===========================================================================
// REVISAR. A ação é idempotente: recomputa a fila a partir do manifesto e do que há em disco,
// não acumula nada. Por isso pode ficar sempre visível e ser apertada à vontade.
// NÃO RECARREGA A PÁGINA: o `location.reload()` de antes jogava fora uma imagem colada e
// ainda não salva — e ele aperta REVISAR justamente quando está com imagem na mão.
const btRevisar = document.getElementById("btRevisar");
btRevisar.addEventListener("click", function () {
  btRevisar.disabled = true; btRevisar.textContent = "revisando…";
  fetch("/revisar", { method: "POST" }).then(r => r.json()).then(function (j) {
    btRevisar.textContent = j.n + " na fila";
    montarFila(); montarPendencias(); pintarAtividade();
    setTimeout(function () {
      btRevisar.textContent = "REVISAR"; btRevisar.disabled = false;
    }, 1800);
  }).catch(function () { btRevisar.textContent = "falhou"; btRevisar.disabled = false; });
});

// ===========================================================================
// Ctrl+V EM QUALQUER LUGAR DA PÁGINA. Antes era preciso CLICAR no campo antes de colar, e
// nada na tela dizia isso — a queixa "colei e não aconteceu nada" era exatamente isto.
//
// O bloco global de subir imagem saiu, mas este ouvinte NÃO foi junto: ele deixou de mandar
// para um campo próprio e passou a entregar a um CARTÃO. Qual: o último em que ele tocou; se
// ainda não tocou em nenhum, o primeiro que estiver visível na tela; e, se nem isso, o
// primeiro da lista. O cartão pisca em ouro e rola até ficar à vista, porque colar no pedido
// errado é o erro caro desta ferramenta — e ver a imagem no cartão certo ANTES de apertar
// Salvar é o que torna o erro reversível.
function cartaoParaColar() {
  const todos = Array.prototype.slice.call(document.querySelectorAll("#lista .pedido"));
  if (!todos.length) return null;
  if (cartaoAlvo && todos.indexOf(cartaoAlvo) >= 0) return cartaoAlvo;
  const visivel = todos.filter(function (c) {
    const r = c.getBoundingClientRect();
    return r.bottom > 0 && r.top < (window.innerHeight || 0);
  });
  return visivel[0] || todos[0];
}

document.addEventListener("paste", function (ev) {
  if (ev.defaultPrevented) return;
  const onde = ev.target;
  if (onde && onde.closest && onde.closest(".cola, textarea, input")) return;
  const itens = (ev.clipboardData || {}).items || [];
  for (const it of itens) {
    if (it.type && it.type.indexOf("image/") === 0) {
      ev.preventDefault();
      const cx = cartaoParaColar();
      if (!cx) {
        // Fila vazia: não há pedido para receber a imagem, e ficar em silêncio seria a mesma
        // queixa de antes com outro nome.
        const v = lista.querySelector(".vazio");
        if (v) v.textContent = "colei uma imagem, mas não há pedido aberto para recebê-la — " +
          "aperte REVISAR, ou espere um pedido novo aparecer aqui.";
        return;
      }
      cartaoAlvo = cx;
      cx._receber(it.getAsFile());
      cx.classList.add("recebeu");
      setTimeout(function () { cx.classList.remove("recebeu"); }, 1500);
      cx.scrollIntoView({ block: "center", behavior: "smooth" });
      return;
    }
  }
});

// ===========================================================================
// TRABALHANDO AGORA — lido do git, nunca de arquivo escrito à mão. FICA NO FIM DA PÁGINA:
// ele nunca pediu este painel por importância, pediu porque a fila estava travada e ele
// queria acompanhar. Acima dele só mora coisa que ELE resolve.
//
// O painel anterior lia `equipe.json` e por isso mostrava para sempre a última frase que
// alguém digitou: em 10/08 ainda dizia "o grão do chrome em voo", de 09/08, com dezenas de
// commits no meio. Um painel de atividade que não é alimentado pela atividade é pior que
// painel nenhum — foi essa classe de mentira que escondeu a fila de arte por dias.
let lidoEmMs = 0;
const escX = t => String(t == null ? "" : t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function pintarAtividade() { return; // dashboard cuida disso desde 21/08
  const cx = document.getElementById("atividade");
  if (!cx) return;
  let a;
  try { a = await (await fetch("/atividade", { cache: "no-store" })).json(); }
  catch (e) {
    cx.innerHTML = '<section class="bloco"><h2>Trabalhando agora</h2>' +
      '<div class="linha"><span style="color:var(--sub)">o servidor nao respondeu — ' +
      'rode: node ferramentas/receber.js</span></div></section>';
    return;
  }
  lidoEmMs = Date.now();
  const curso = a.emCurso || [];
  const selo = a.trabalhando
    ? '<span class="selo sVoo">EM CURSO</span>'
    : (curso.length ? '<span class="selo sFrio">PARADO</span>'
                    : '<span class="selo sParado">NADA EM CURSO</span>');

  let linhas;
  if (curso.length) {
    linhas = curso.map(i =>
      '<div class="linha"><span class="marca">ha ' + escX(i.ha) + '</span>' +
      '<span class="assunto">' + escX(i.arquivo) + '</span>' +
      '<span class="selo sParado">' + escX(i.estado) + '</span></div>').join('') +
      (a.totalEmCurso > curso.length
        ? '<div class="linha"><span class="marca"></span><span class="assunto" style="color:var(--sub)">' +
          '+ ' + (a.totalEmCurso - curso.length) + ' outros arquivos abertos</span></div>' : '');
    if (!a.trabalhando) {
      linhas += '<div class="linha"><span class="assunto" style="color:var(--sub)">' +
        'nenhum desses arquivos foi tocado nos ultimos 20 min — a arvore esta suja, mas parada' +
        '</span></div>';
    }
  } else {
    linhas = '<div class="linha"><span class="assunto" style="color:var(--sub)">' +
      'nada aberto na arvore de trabalho' +
      (a.ultimo ? ' — o ultimo commit foi ha ' + escX(a.ultimo.ha) : '') +
      '</span></div>';
  }

  const commits = (a.commits || []).map(function (c) {
    const hoje = (a.lidoEm || '').slice(0, 10) === ((c.quando || '').slice(0, 10));
    return '<div class="linha"><span class="marca">' +
      escX(hoje ? c.hora : c.dia + ' ' + c.hora) + '</span>' +
      '<span class="assunto">' + escX(c.assunto) + '</span>' +
      '<span class="selo sFeito">' + (c.juncao ? 'juncao'
        : escX((c.pastas || []).join(' ') || '(raiz)') + ' · ' + c.n) + '</span></div>';
  }).join('') || '<div class="linha"><span class="assunto" style="color:var(--sub)">' +
    'nenhum commit no historico</span></div>';

  cx.innerHTML = '<section class="bloco">' +
    '<h2>Trabalhando agora ' + selo + '</h2>' + linhas +
    '<hr class="divisa"><h2>Ultimas horas de trabalho</h2>' + commits +
    '<p class="rodape" id="atvRodape">' +
      'lido do git as ' + escX((a.lidoEm || '').slice(11)) +
      (a.build ? ' · index.html construido ha ' + escX(a.build.ha) + ' (' + a.build.kb + ' KB)' : '') +
      ' · <span id="atvIdade">agora</span></p>' +
    '</section>';
}
pintarAtividade();

// A IDADE DO DADO, contando na tela. Um painel que se atualiza sozinho e um painel travado são
// visualmente idênticos até você ver o relógio parar — este segundo contador é a prova de vida,
// e foi exatamente o que faltou para o painel de antes ser pego mentindo por um dia inteiro.
setInterval(function () {
  const alvo = document.getElementById("atvIdade");
  if (!alvo || !lidoEmMs) return;
  const s = Math.round((Date.now() - lidoEmMs) / 1000);
  alvo.textContent = s < 5 ? "lido agora" : "lido ha " + (s < 90 ? s + " s" : Math.round(s / 60) + " min");
  alvo.style.color = s > 60 ? "#e0a03a" : "";
}, 1000);
setInterval(pintarAtividade, 10000);

// Soltar FORA de um alvo não pode abrir a imagem numa aba e engolir a mesa. O navegador faz
// isso por padrão; barrar na janela inteira é a única forma de errar a mira sair barato.
["dragover", "drop"].forEach(function (n) {
  window.addEventListener(n, function (ev) { ev.preventDefault(); }, false);
});

// As duas listas se atualizam sozinhas — mas nunca por cima de trabalho em andamento. Se há
// uma imagem colada e ainda não salva (`.cola.tem`), remontar jogaria fora a colagem.
setInterval(function () {
  if (document.querySelector(".cola.tem")) return;
  // E nunca por cima de uma pergunta ABERTA ou com resposta começada: remontar fecharia a
  // dobra que ele acabou de abrir e apagaria o que ele estava escrevendo. Ler e responder
  // são trabalho em andamento tanto quanto uma imagem colada.
  const lendo = document.querySelector("#pendencias details[open]");
  let escrevendo = false;
  document.querySelectorAll(".rmResp").forEach(function (t) { if (t.value.trim()) escrevendo = true; });
  if (!lendo && !escrevendo) montarPendencias();
  fetch("/fila").then(r => r.json()).then(function (f) {
    if (!f.contagem || f.contagem.gerar === ultimaContagem) return;
    montarFila();
  }).catch(function () {});
}, 15000);

// ===== BACKLOG (dono, 21/08): reordenavel; a ordem E a prioridade =====
let blDoc = null;
function pintarBacklog() {
  const cx = document.getElementById('backlog');
  const itens = (blDoc && blDoc.itens) || [];
  document.getElementById('quantasBacklog').textContent = itens.length || '';
  if (!itens.length) { cx.innerHTML = '<p class="vazio">backlog vazio</p>'; return; }
  cx.innerHTML = '';
  itens.forEach(function (it, i) {
    const d = document.createElement('div');
    d.className = 'pedido';
    d.style.padding = '9px 12px';
    d.innerHTML = '<div style="display:flex;gap:10px;align-items:flex-start">' +
      '<div style="display:flex;flex-direction:column;gap:2px;flex:0 0 auto">' +
      '<button data-mv="-1" style="margin:0;padding:1px 9px"' + (i===0?' disabled':'') + '>▲</button>' +
      '<button data-mv="1" style="margin:0;padding:1px 9px"' + (i===itens.length-1?' disabled':'') + '>▼</button></div>' +
      '<div style="flex:1"><div class="titulo" style="font-size:17px;margin:0">' + (i+1) + '. ' + it.titulo + '</div>' +
      (it.detalhe ? '<div class="ref" style="margin:2px 0 0">' + it.detalhe + '</div>' : '') + '</div></div>';
    d.querySelectorAll('button[data-mv]').forEach(function (b) {
      b.addEventListener('click', function () {
        const dir = parseInt(b.getAttribute('data-mv'), 10);
        const j = i + dir;
        const t = itens[i]; itens[i] = itens[j]; itens[j] = t;
        pintarBacklog();
        fetch('/backlog', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(blDoc) }).then(r => r.json()).then(function (x) {
            if (!x.ok) throw 0;
          }).catch(function () { alert('nao salvou a ordem — o servidor caiu?'); });
      });
    });
    cx.appendChild(d);
  });
}
// CONFIRMAR (dono, 21/08): reordenar salva no disco em silencio; ESTE botao me NOTIFICA —
// grava a ordem na fila do dashboard (mesa_resposta) que o plantao consome.
document.getElementById('confirmar-prioridades').addEventListener('click', function () {
  const b=this, est=document.getElementById('conf-estado');
  if(!blDoc){ est.textContent='backlog ainda não carregou'; return; }
  b.disabled=true; est.textContent='avisando…';
  fetch('https://hdhqziqvrthxtgyraemk.supabase.co/rest/v1/mesa_resposta',{
    method:'POST',
    headers:{ apikey:'sb_publishable_kR7pCuqZrPAr24Xdr0F4Nw_t1j5YUKN',
      Authorization:'Bearer sb_publishable_kR7pCuqZrPAr24Xdr0F4Nw_t1j5YUKN',
      'Content-Type':'application/json', Prefer:'return=minimal' },
    body: JSON.stringify({ tipo:'backlog', chave:'confirmado',
      texto: blDoc.itens.map(function(it,n){return (n+1)+'.'+it.id;}).join(' ') })
  }).then(function(r){ if(!r.ok) throw 0;
    est.textContent='✓ avisado — o Claude realinha no próximo ciclo';
  }).catch(function(){ est.textContent='não consegui avisar (rede?) — a ordem ESTÁ salva no disco';
  }).finally(function(){ setTimeout(function(){ b.disabled=false; }, 2500); });
});
fetch('/backlog').then(r => r.json()).then(function (d) { blDoc = d; pintarBacklog(); })
  .catch(function () { document.getElementById('backlog').innerHTML = '<p class="vazio">sem backlog (o servidor tem /backlog?)</p>'; });

// ===== ATIVIDADES: rolando agora (painel dos agentes, via backend) + ultimas 24h (git) =====
const SB = 'https://hdhqziqvrthxtgyraemk.supabase.co/rest/v1';
const SB_K = 'sb_publishable_kR7pCuqZrPAr24Xdr0F4Nw_t1j5YUKN';
function pintarRolando() {
  fetch(SB + '/mesa_agente?select=nome,status,atividade,ativo_em&order=ordem',
    { headers: { apikey: SB_K, Authorization: 'Bearer ' + SB_K } })
    .then(r => r.json()).then(function (ags) {
      const on = ags.filter(a => a.status === 'trabalhando');
      const cx = document.getElementById('rolando');
      cx.innerHTML = '<section class="bloco"><h2>Rolando agora</h2>' +

          (a.atividade || 'trabalhando') + '</span><span class="selo sVoo">EM VOO</span></div>').join('') :
          '<div class="linha"><span class="sub">ninguém em voo agora — "nada em curso" é informação</span></div>') +
        '</section>';
    }).catch(function () {
      document.getElementById('rolando').innerHTML = '<section class="bloco"><h2>Rolando agora</h2><div class="linha"><span class="sub">sem conexão com o painel</span></div></section>';
    });
}
function pintarUlt24() {
  fetch('/atividade', { cache: 'no-store' }).then(r => r.json()).then(function (a) {
    const dia = (a.commits || []).filter(c => c.minutos <= 1440);
    document.getElementById('ult24').innerHTML = '<section class="bloco"><h2>Últimas 24 h — ' +
      dia.length + ' entregas</h2>' +
      (dia.length ? dia.map(c => '<div class="linha"><span class="marca">' + c.ha + '</span><span>' +
        c.assunto + '</span></div>').join('') :
        '<div class="linha"><span class="sub">nenhuma entrega nas últimas 24 h</span></div>') +
      '</section>';
  }).catch(function () {});
}
pintarRolando(); pintarUlt24();
setInterval(pintarRolando, 15000);
setInterval(pintarUlt24, 60000);
