<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de máquinas · BRASIL</title>
<style>
  /* A MESA FALA A LINGUA DO JOGO. O dono: "gosto mais do layout da sala de maquinas".
     Mesma gramatica do chrome: madeira = coisa posta no lugar, pedra = ferramenta,
     papel de campo = o que espera voce, e um ouro so — o que importa agora. */
  :root { color-scheme: dark;
    --fundo:#1c2010; --painel:#2b3320; --painel2:#3c4627; --borda:#14170c;
    --texto:#f2e8ce; --sub:#a9a184; --ouro:#eba748; --papel:#e9d8ae; --tinta:#33240f;
    --good:#7d9a3c; --run:#71a39c; }
  body { margin: 0; padding: 24px; background: var(--fundo); color: var(--texto);
         font: 15px/1.5 "Cascadia Mono", Consolas, ui-monospace, monospace; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .2em; color: var(--ouro);
       text-shadow: 0 2px 0 var(--borda); }
  .sub { color: var(--sub); margin: 0 0 22px; font-size: 12px; }
  /* SALA DE MAQUINAS */
  #equipe { display: flex; flex-direction: column; gap: 16px; }
  #equipe h2 { font-size: 11px; letter-spacing: .28em; color: var(--sub); margin: 0 0 9px;
    text-transform: uppercase; }
  .bloco { background: var(--painel); border: 2px solid var(--borda);
    box-shadow: 0 4px 0 var(--borda); padding: 14px 16px; }
  .bloco.emPapel { background: var(--papel); color: var(--tinta); }
  .bloco.emPapel h2 { color: #7a5a28; }
  .linha { display: flex; gap: 12px; padding: 6px 0; align-items: baseline; font-size: 13px; }
  .linha + .linha { border-top: 1px solid rgba(20,23,12,.35); }
  .marca { color: var(--sub); font-size: 11px; min-width: 92px; flex: 0 0 auto; }
  .emPapel .marca { color: #8a6b3d; }
  .selo { font-size: 10px; letter-spacing: .12em; padding: 2px 8px; border: 2px solid var(--borda);
    box-shadow: 2px 2px 0 var(--borda); flex: 0 0 auto; margin-left: auto; }
  .sVoo { background: var(--run); color: #101b19; animation: pulsa 1.6s ease-in-out infinite; }
  .sFeito { background: var(--good); color: #141b08; }
  .sVoce { background: var(--ouro); color: #221a06; }
  @keyframes pulsa { 50% { opacity: .5 } }
  @media (prefers-reduced-motion: reduce) { .sVoo { animation: none } }
  .secao { font-size: 11px; letter-spacing: .28em; color: var(--sub); margin: 0 0 9px;
    text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
  #quantasFaltam { font-size: 10px; letter-spacing: .12em; padding: 2px 8px;
    border: 2px solid var(--borda); box-shadow: 2px 2px 0 var(--borda);
    background: var(--ouro); color: #221a06; }
  #quantasFaltam:empty { display: none; }
  #equipe { margin-top: 34px; }
  .pedido { border: 2px solid var(--borda); padding: 16px; margin-bottom: 16px;
            background: var(--painel); box-shadow: 0 4px 0 var(--borda); }
  .pedido.feito { border-color: var(--good); }
  .titulo { font-weight: 600; margin-bottom: 2px; }
  .ref { color: #8d8a80; font-size: 13px; margin-bottom: 10px; }
  .prompt { background: #101218; border: 1px solid #2c3038; border-radius: 6px; padding: 10px;
            font: 12px/1.45 ui-monospace, monospace; color: #b8c9a8; white-space: pre-wrap;
            max-height: 130px; overflow: auto; margin-bottom: 10px; }
  .cola { border: 2px dashed #3a4049; border-radius: 6px; padding: 22px; text-align: center;
          color: #8d8a80; cursor: text; outline: none; font-size: 14px; }
  .cola:focus { border-color: #6fdd94; color: #b8c9a8; }
  .cola.tem { border-style: solid; border-color: var(--good); padding: 8px; }
  .cola img { max-width: 100%; max-height: 260px; display: block; margin: 0 auto; }
  .estado { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .ok { color: #6fdd94; } .erro { color: #e0603a; }
  button { background: var(--ouro); color: #221a06; border: 2px solid var(--borda);
           box-shadow: 0 3px 0 var(--borda); padding: 8px 16px;
           font: 600 14px system-ui; cursor: pointer; margin-top: 10px; }
  button:disabled { background: #2c3038; color: #6b6862; cursor: default; }
  button.secundario { background: #2c3038; color: #d8d5cc; margin: 0 0 12px; padding: 6px 12px;
                      font-size: 13px; }
  .vazio { color: #8d8a80; font-size: 14px; }
  /* PENDÊNCIAS: o que está parado esperando o dono. */
  #pendencias { margin-top: 40px; border-top: 1px solid #2c3038; padding-top: 22px; }
  #pendencias h2 { font-size: 15px; margin: 0 0 4px; }
  .rmItem { background: #191c23; border: 1px solid #2c3038; border-radius: 6px;
            padding: 9px 12px; margin-bottom: 6px; }
  .rmL { display: flex; gap: 8px; align-items: baseline; }
  .rmS { font-size: 10px; letter-spacing: .06em; padding: 2px 6px; border-radius: 3px;
         flex: 0 0 auto; text-transform: uppercase; }
  .s-decisão-de-jogo, .s-decisao-de-jogo { background: #4a3a1a; color: #ffcd75; }
  .s-representação, .s-representacao { background: #4a2438; color: #e0a0c0; }
  .s-trava-de-motor { background: #4a2a20; color: #e0a08a; }
  .s-pequeno { background: #2c3038; color: #b0aca2; }
  .rmT { font-size: 13px; color: #e8e6df; font-weight: 600; }
  .rmN { font-size: 12px; color: #8d8a80; margin-top: 5px; line-height: 1.55; }
  .rmResp { width: 100%; box-sizing: border-box; margin-top: 9px; padding: 8px 10px;
    background: #101218; border: 1px solid #2c3038; border-radius: 5px; color: #e8e6df;
    font: 13px/1.5 system-ui, sans-serif; resize: vertical; min-height: 38px; }
  .rmResp:focus { outline: none; border-color: #6fdd94; }
  .rmResp.salvo { border-color: #38b764; }
  .resposta { margin-top: 14px; padding: 12px; border-radius: 6px; border-left: 3px solid #3a4049;
              background: #101218; }
  .resposta.vOk { border-left-color: #38b764; }
  .resposta.vRefazer { border-left-color: #e0a03a; }
  .resposta.vEsperando { border-left-color: #4a5568; }
  .vTitulo { font-weight: 600; margin-bottom: 6px; }
  .vOk .vTitulo { color: #6fdd94; }
  .vRefazer .vTitulo { color: #ffcd75; }
  .vEsperando .vTitulo { color: #8d8a80; }
  .vTexto { font-size: 14px; margin-bottom: 10px; white-space: pre-wrap; }
  /* Barra de 0 a 100 no estado de espera. IMPORTANTE: é ESTIMATIVA por tempo decorrido,
     não progresso real — o navegador não tem como saber quanto falta da análise. Por isso
     ela sobe até 95 e PARA lá, e só vai a 100 quando o veredito chega de verdade. Uma barra
     que chega sozinha a 100 e continua esperando é uma barra que mente. */
  .barraFora { height: 8px; background: #22262e; border-radius: 4px; overflow: hidden;
               margin: 8px 0 4px; }
  .barraDentro { height: 100%; width: 0; background: #38b764; border-radius: 4px;
                 transition: width .5s linear; }
  .barraDentro.cheia { background: #6fdd94; }
  .pct { font: 12px ui-monospace, monospace; color: #8d8a80; display: flex;
         justify-content: space-between; }
</style>
</head>
<body>
<h1>SALA DE MÁQUINAS</h1>
<p class="sub">Gere a imagem onde quiser, copie, e cole no campo do pedido.
Ctrl+V. O arquivo cai em <code>assets/entrada/</code>.</p>
<div id="chegadas"></div>
<h2 class="secao">Arte que o jogo espera <span id="quantasFaltam"></span></h2>
<div id="lista"><p class="vazio">carregando…</p></div>
<div id="equipe"></div>
<div id="pendencias"></div>

<script>
// A página é burra de propósito: lê a lista de pedidos que o Claude escreveu, recebe uma
// colagem, e manda o data-uri para o servidor local gravar. Nada além disso.
const lista = document.getElementById("lista");

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;   // textContent, nunca innerHTML
  return e;
}

// O laço de conversa: depois que você cola, o Claude analisa o arquivo e escreve a resposta
// de volta no pedidos.json. Esta página relê o arquivo a cada 3s e mostra o veredito aqui,
// para você não precisar ficar olhando o chat. `rodada` sobe a cada ida e volta: é ela que
// diz à página que a resposta é NOVA e não a da tentativa anterior.
const cards = {};

function pintarResposta(cx, p) {
  let r = cx.querySelector(".resposta");
  if (!r) { r = el("div", "resposta"); cx.appendChild(r); }
  r.textContent = "";
  if (!p.resposta) { r.style.display = "none"; return; }
  r.style.display = "";
  const est = p.resposta.estado;
  r.className = "resposta " + (est === "ok" ? "vOk" : est === "refazer" ? "vRefazer" : "vEsperando");
  if (est === "esperando") {
    r.appendChild(el("div", "vTitulo", "Analisando"));
    const fora = el("div", "barraFora"), dentro = el("div", "barraDentro");
    fora.appendChild(dentro);
    const linha = el("div", "pct");
    const esq = el("span", null, "0%"), dir = el("span", null, "0s");
    linha.appendChild(esq); linha.appendChild(dir);
    r.appendChild(fora); r.appendChild(linha);
    // Curva que desacelera: rápido no começo, arrastando perto do teto. Nunca passa de 95 —
    // os 5 que faltam são o veredito chegando, e quem os entrega é o Claude, não o relógio.
    const t0 = Date.now(), TIPICO = 90000;
    if (cx._relogio) clearInterval(cx._relogio);
    cx._relogio = setInterval(function () {
      const s = (Date.now() - t0) / 1000;
      const p = Math.min(95, Math.round(95 * (1 - Math.exp(-s * 1000 / TIPICO))));
      dentro.style.width = p + "%";
      esq.textContent = p + "%";
      dir.textContent = s < 60 ? Math.round(s) + "s"
        : Math.floor(s / 60) + "m" + String(Math.round(s % 60)).padStart(2, "0");
    }, 500);
  } else {
    if (cx._relogio) { clearInterval(cx._relogio); cx._relogio = null; }
    r.appendChild(el("div", "vTitulo",
      est === "ok" ? "✓ Está bom — pode seguir" : "↻ Precisa refazer"));
    const fora = el("div", "barraFora"), dentro = el("div", "barraDentro cheia");
    dentro.style.width = "100%";
    fora.appendChild(dentro);
    r.appendChild(fora);
  }
  if (p.resposta.texto) r.appendChild(el("div", "vTexto", p.resposta.texto));
  if (p.resposta.promptNovo) {
    r.appendChild(el("div", "ref", "Prompt novo — gere de novo com este e cole outra vez:"));
    const pn = el("div", "prompt", p.resposta.promptNovo);
    r.appendChild(pn);
    const b = el("button", null, "Copiar prompt novo");
    b.addEventListener("click", function () {
      navigator.clipboard.writeText(p.resposta.promptNovo)
        .then(function () { b.textContent = "copiado ✓"; })
        .catch(function () { b.textContent = "copie à mão do quadro acima"; });
    });
    r.appendChild(b);
  }
}

// A mesa era burra: listava o pedido mesmo depois do arquivo ter chegado, e eu ficava
// pedindo coisa já entregue. O servidor sempre soube o que tem em disco (/recebidas); a
// página é que não perguntava. Agora pergunta, e marca sozinha.
function marcarRecebidas() {
  fetch("/recebidas").then(r => r.json()).then(function (arquivos) {
    const chegou = {};
    arquivos.forEach(function (f) { chegou[f.replace(/\.(png|jpg|jpeg|webp)$/i, "")] = f; });
    for (const nome in cards) {
      const c = cards[nome];
      if (!chegou[nome] || c.marcado) continue;
      c.marcado = true;
      // SOME da lista, não fica marcado. Card marcado ainda ocupa espaço e ainda LÊ como
      // pedido — o dono achou que a fila estava repetindo quando na verdade estava só
      // mostrando o que já tinha entregue. A lista é uma fila de trabalho, não um histórico.
      c.el.style.display = "none";
      c.el.className = "pedido feito";
      const t = c.el.querySelector(".titulo");
      if (t && t.textContent.indexOf("✓") !== 0) t.textContent = "✓ " + t.textContent;
      const alvo = c.el.querySelector(".cola");
      if (alvo) alvo.textContent = "já recebida (" + chegou[nome] + ") — cole de novo só se for refazer";
      const b = c.el.querySelector(".secundario");
      if (b) b.style.opacity = "0.5";
    }
    contarPendentes();
  }).catch(function () {});
}

// O roadmap vive abaixo da fila porque fila sem destino e so lista de tarefas: da para
// entregar os cinco pedidos e nao saber para onde o jogo esta indo.
function montarPendencias() {
  fetch("/pendencias").then(r => r.json()).then(function (pd) {
    const box = document.getElementById("pendencias");
    box.textContent = "";
    if (!pd.itens) return;
    // SO O QUE AINDA NAO FOI RESPONDIDO. Item respondido deixou de ser pendencia e virou
    // trabalho MEU — mante-lo aqui faz a lista so crescer, e lista que so cresce ninguem le.
    // A resposta nao se perde: continua no pendencias.json, que e o que eu leio.
    box.appendChild(el("h2", null, "Esperando você"));
    const abertos = (pd.itens || []).filter(function (i) { return !String(i.resposta || "").trim(); });
    if (!abertos.length) {
      box.appendChild(el("p", "sub", "Nada pendente — tudo que eu precisava de você já foi respondido."));
      return;
    }
    box.appendChild(el("p", "sub", pd._ || ""));
    abertos.forEach(function (i) {
      const it = el("div", "rmItem");
      const l = el("div", "rmL");
      l.appendChild(el("span", "rmS s-" + String(i.p || "").replace(/ /g, "-"), i.p || ""));
      l.appendChild(el("span", "rmT", i.t));
      it.appendChild(l);
      if (i.n) it.appendChild(el("div", "rmN", i.n));
      // Campo de resposta: o dono escreve aqui e eu leio no arquivo. Mais confiavel que o
      // chat, porque nao se perde no rolar — e fica junto da pergunta que respondeu.
      const ta = document.createElement("textarea");
      ta.className = "rmResp";
      ta.placeholder = "sua resposta…";
      ta.value = i.resposta || "";
      // ENVIAR é explícito. Antes, o "change" do textarea disparava ao sair do campo — o dono
      // nunca sabia se tinha enviado, e um clique fora mandava resposta pela metade. Agora há
      // um botão, ele diz o que faz, e a pendência SOME quando a resposta chega ao disco.
      const env = document.createElement("button");
      env.textContent = "ENVIAR RESPOSTA";
      env.disabled = true;
      ta.addEventListener("input", function () { env.disabled = !ta.value.trim(); });
      const mandar = function () {
        if (!ta.value.trim()) return;
        env.disabled = true; env.textContent = "enviando…";
        fetch("/responder", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ t: i.t, resposta: ta.value }) })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            // Sai da tela deslizando, para o gesto ter consequência visível: respondeu, sumiu.
            it.style.transition = "opacity .35s, transform .35s";
            it.style.opacity = "0"; it.style.transform = "translateX(18px)";
            setTimeout(function () { montarPendencias(); }, 380);
            if (d && d.restam === 0) console.log("fila de pendências zerada");
          })
          .catch(function () { env.disabled = false; env.textContent = "ENVIAR RESPOSTA"; });
      };
      env.addEventListener("click", mandar);
      // Ctrl+Enter manda sem tirar a mão do teclado.
      ta.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); mandar(); }
      });
      it.appendChild(ta);
      it.appendChild(env);
      box.appendChild(it);
    });
  }).catch(function () {});
}
montarPendencias();

function puxar() {
  marcarRecebidas();
  fetch("/pedidos").then(r => r.json()).then(function (pedidos) {
    pedidos.forEach(function (p) {
      const c = cards[p.nome];
      if (!c) return;
      const rod = (p.resposta && p.resposta.rodada) || 0;
      if (rod !== c.rodada) { c.rodada = rod; pintarResposta(c.el, p); }
    });
  }).catch(function () {});
}

fetch("/pedidos").then(r => r.json()).then(function (pedidos) {
  lista.textContent = "";
  // REVISAR fica SEMPRE visivel. Eu tinha escondido com fila cheia, achando que so faria
  // sentido no vazio — errado: o dono precisa poder conferir quando quiser, e a acao e
  // idempotente (recomputa a fila a partir do manifesto e do que ha em disco, nao acumula).
  const bRev = el("button", "secundario", "REVISAR O QUE FALTA");
  bRev.addEventListener("click", function () {
    bRev.disabled = true; bRev.textContent = "revisando…";
    fetch("/revisar", { method: "POST" }).then(r => r.json()).then(function (j) {
      bRev.textContent = j.n + " na fila — recarregando";
      montarPendencias();
      setTimeout(function () { location.reload(); }, 700);
    }).catch(function () { bRev.textContent = "falhou"; bRev.disabled = false; });
  });
  lista.appendChild(bRev);
  if (!pedidos.length) {
    lista.appendChild(el("p", "vazio", "Fila vazia — nada falta que o manifesto conheca."));
    return;
  }
  pedidos.forEach(function (p) {
    const cx = el("div", "pedido");
    cards[p.nome] = { el: cx, rodada: (p.resposta && p.resposta.rodada) || 0 };
    cx.appendChild(el("div", "titulo", p.titulo || p.nome));
    cx.appendChild(el("div", "ref", (p.referencia || "") + (p.tamanho ? " · " + p.tamanho : "")));
    if (p.prompt) {
      cx.appendChild(el("div", "prompt", p.prompt));
      const bc = el("button", "secundario", "Copiar prompt");
      bc.addEventListener("click", function () {
        navigator.clipboard.writeText(p.prompt)
          .then(function () { bc.textContent = "copiado ✓";
            setTimeout(function () { bc.textContent = "Copiar prompt"; }, 2000); })
          .catch(function () { bc.textContent = "copie à mão do quadro acima"; });
      });
      cx.appendChild(bc);
    }

    const alvo = el("div", "cola", "clique aqui e cole a imagem (Ctrl+V)");
    alvo.tabIndex = 0;
    const estado = el("div", "estado");
    const botao = el("button", null, "Salvar");
    botao.disabled = true;
    let dados = null;

    alvo.addEventListener("paste", function (ev) {
      const itens = (ev.clipboardData || {}).items || [];
      for (const it of itens) {
        if (it.type && it.type.indexOf("image/") === 0) {
          ev.preventDefault();
          const arq = it.getAsFile();
          const fr = new FileReader();
          fr.onload = function () {
            dados = fr.result;
            alvo.textContent = "";
            alvo.className = "cola tem";
            const img = new Image();
            img.onload = function () {
              estado.className = "estado";
              estado.textContent = img.naturalWidth + " × " + img.naturalHeight + " px · pronta para salvar";
            };
            img.src = dados;
            alvo.appendChild(img);
            botao.disabled = false;
          };
          fr.readAsDataURL(arq);
          return;
        }
      }
      estado.className = "estado erro";
      estado.textContent = "não vi imagem na área de transferência — copie a imagem, não o link";
    });

    botao.addEventListener("click", function () {
      if (!dados) return;
      botao.disabled = true;
      estado.className = "estado";
      estado.textContent = "salvando…";
      fetch("/salvar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome: p.nome, pedido: p.titulo || p.nome, origem: p.origem || "", dados: dados })
      }).then(r => r.json().then(j => ({ ok: r.ok, j: j }))).then(function (r) {
        if (!r.ok || !r.j.ok) throw new Error("recusado");
        estado.className = "estado ok";
        estado.textContent = "salva em " + r.j.arquivo + " (" + r.j.bytes + " bytes)";
        cx.className = "pedido feito";
        // A partir daqui a bola é do Claude: a página passa a esperar o veredito dele.
        pintarResposta(cx, { resposta: { estado: "esperando",
          texto: "Recebi. O Claude vai medir o arquivo e responder aqui — pode deixar esta aba aberta." } });
      }).catch(function () {
        estado.className = "estado erro";
        estado.textContent = "falhou ao salvar";
        botao.disabled = false;
      });
    });

    cx.appendChild(alvo);
    cx.appendChild(estado);
    cx.appendChild(botao);
    pintarResposta(cx, p);
    lista.appendChild(cx);
  });
  marcarRecebidas();
  setInterval(puxar, 3000);
}).catch(function () {
  lista.textContent = "";
  lista.appendChild(el("p", "vazio", "o servidor não respondeu — rode: node ferramentas/receber.js"));
});

// A SALA DE MAQUINAS. Le ferramentas/equipe.json, que o orquestrador atualiza a cada
// integracao. Tres blocos: quem trabalha AGORA, o que ja entrou, e o que espera — sendo
// que o que espera VOCE vem em papel de campo, porque e a sua parte.
// Quantas imagens ainda faltam. E o unico numero da mesa que mede TRABALHO DO DONO,
// entao fica ao lado do titulo, em ouro, no topo da pagina.
function contarPendentes() {
  const n = document.querySelectorAll('#lista .pedido:not([style*="display: none"])').length;
  const alvo = document.getElementById('quantasFaltam');
  if (!alvo) return;
  alvo.textContent = n ? (n === 1 ? '1 FALTANDO' : n + ' FALTANDO') : '';
  if (!n) {
    const l = document.getElementById('lista');
    if (l && !l.querySelector('.vazio')) {
      l.insertAdjacentHTML('beforeend',
        '<p class="vazio">nada esperando você aqui — a fila de arte está limpa.</p>');
    }
  }
}

async function pintarEquipe() {
  let e = {};
  try { e = await (await fetch('/equipe')).json(); } catch (err) { return; }
  const cx = document.getElementById('equipe');
  if (!cx) return;
  const esc = t => String(t == null ? '' : t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const voo = (e.emVoo || []).map(a =>
    `<div class="linha"><span class="marca">${esc(a.papel)}</span><span>${esc(a.t)}</span>` +
    `<span class="selo sVoo">EM VOO</span></div>`).join('');
  const feito = (e.entregue || []).slice(0, 8).map(a =>
    `<div class="linha"><span class="marca">${esc(a.q)}</span><span>${esc(a.t)}</span>` +
    `<span class="selo sFeito">NO AR</span></div>`).join('');
  const prox = (e.proximos || []).map(a => {
    const seuTurno = /VOC/i.test(a.dep || '');
    return `<div class="linha"><span>${esc(a.t)}</span>` +
      `<span class="selo ${seuTurno ? 'sVoce' : 'sFeito'}">${esc(a.dep)}</span></div>`;
  }).join('');
  cx.innerHTML =
    (voo ? `<section class="bloco"><h2>Trabalhando agora</h2>${voo}</section>` :
           `<section class="bloco"><h2>Trabalhando agora</h2>` +
           `<div class="linha"><span style="color:var(--sub)">ninguém em voo — tudo integrado</span></div></section>`) +
    `<section class="bloco emPapel"><h2>Próximo passo</h2>${prox}</section>` +
    `<section class="bloco"><h2>Já entrou no jogo</h2>${feito}</section>` +
    `<p class="sub" style="margin:0">${esc(e.atualizado || '')}</p>`;
}
pintarEquipe();

// O QUE CHEGOU E ESPERA PROCESSAMENTO. Fica no topo, em ouro, porque e o unico estado em
// que a bola esta comigo e o dono nao tem o que fazer — mas precisa VER que chegou.
async function pintarChegadas() {
  let l = [];
  try { l = await (await fetch('/chegadas')).json(); } catch (e) { return; }
  const cx = document.getElementById('chegadas');
  if (!cx) return;
  if (!l.length) { cx.innerHTML = ''; return; }
  const esc = t => String(t == null ? '' : t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  cx.innerHTML = '<h2 class="secao">Chegou e ainda não entrou no jogo</h2>' +
    '<section class="bloco">' + l.map(i =>
      `<div class="linha"><span class="marca">${esc(i.quando)}</span><span>${esc(i.nome)}</span>` +
      `<span class="selo sVoo">COMIGO</span></div>`).join('') + '</section>';
}
pintarChegadas();

// A mesa se atualiza sozinha. Antes, a fila so se repunha quando alguem apertava REVISAR e
// o painel so mudava recarregando a pagina — o dono via "fila vazia, ninguem em voo" com
// trabalho acontecendo e arte esperando.
setInterval(function () { pintarChegadas(); pintarEquipe(); montarPendencias(); }, 15000);
</script>
