<!-- The game is one file and reaches for nothing but its own art packs. This makes the browser
     hold it to that: no script, style or image may come from anywhere but this document, and
     the only address it may open is one on this very site. 'unsafe-inline' is required because
     the script and the styles live in the page itself, and data: is required because every
     sprite is a base64 URI — including the ones that arrive inside a pack.

     UMA DIRETIVA MUDOU DUAS VEZES, e as duas estão escritas por extenso porque §3.2 do
     CLAUDE.md manda dizer no commit o que passou a ser permitido:
       1. `connect-src` era 'none' e ganhou 'self' em 10/08, quando a arte de cada capítulo
          saiu do arquivo de abertura para `pack-*.json` (o jogo levava 16,6 s para aceitar o
          primeiro toque em 3G; ver RELATORIO-PESO.md). 'self' é "só o próprio site".
       2. E ganhou UM host, no mesmo 10/08: `https://us.i.posthog.com`, para onde vai a
          contagem anônima que a tela de AJUSTES descreve e permite desligar. Um host, escrito
          inteiro, com esquema — não um curinga, não um `*.posthog.com`, não um `https:` solto.
          Este é o endereço exato do `ENDERECO_MEDIDA` no jogo, e o ferramentas/construir.js
          recusa construir se os dois deixarem de dizer o mesmo host.
     Nada MAIS abriu: `default-src` continua 'none', `img-src` continua só `data:` (a arte
     chega como data: de dentro do pacote), e não há `script-src` de host nenhum — ou seja, a
     biblioteca do PostHog não teria como ser carregada nem que alguém tentasse. É de propósito:
     o que fala com o PostHog são ~20 linhas neste arquivo, e não um script de terceiro. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self' https://us.i.posthog.com; base-uri 'none'; form-action 'none'">
<!-- frame-ancestors is deliberately absent: a browser ignores it in a <meta> element and
     logs a warning. Clickjacking protection has to come from an HTTP header, so if this is
     ever hosted somewhere that matters, set X-Frame-Options or frame-ancestors there. -->
<meta name="apple-mobile-web-app-title" content="BRASIL">
<title>BRASIL — um jogo sobre a história do Brasil</title>
<!-- O CARTÃO DO LINK. Sem isto, o jogo vira um retângulo cinza no WhatsApp — que é por onde
     ele vai circular. Estas tags NÃO são carregadas pelo jogo: quem as lê é o robô que monta
     a prévia do link, e por isso a imagem apontada aqui é a única coisa fora do arquivo único
     (o `construir.js` a copia para `dist/`). A regra do §3.1 continua valendo para o JOGO.
     O ENDEREÇO NÃO SE ESCREVE AQUI. As duas URLs abaixo trazem a marca da base, e o
     `ferramentas/construir.js` troca as duas pela mesma linha de `ferramentas/dominio.js` —
     porque elas mudam JUNTAS com a base de onde a página é servida, ou a prévia quebra em
     silêncio (robô de rede social não avisa, só mostra o retângulo cinza de volta). Trocar de
     domínio, de subdomínio ou de subcaminho é trocar UMA linha lá. -->
<!-- domínio do dono desde 10/08/2026: matheusferreira.cc, na RAIZ. -->
<meta name="description" content="Uma jovem atravessa a história do Brasil e o que ela alcança fica de pé. Dos povos que já estavam aqui a hoje, com fonte para cada afirmação.">

<!-- owner: the opening card is gone. The game starts on the street, and the first-run
     guide is what explains it, one line at a time. -->

<!-- The board's top bar: one dark rail of counters, and a gear standing apart at its end. -->
<div id="hudTop">
  <div id="hudLinha">
  <div id="barraTopo">
    <div class="chip" id="chipTaxa"><canvas class="pi" data-i="leaf" width="13" height="13"></canvas>
      <div class="cInfo"><div class="valor" id="energia">0</div></div></div>
    <!-- what the street has given you, counted. The sprites are the drops themselves. -->
    <div id="recursos">
      <!-- OS TRÊS NASCEM OCULTOS AQUI, NA MARCAÇÃO, e é isto que mudou quando a obra passou a
           CONSUMIR recurso. Antes o esconderijo era o próprio `recNaTela`, que fazia
           `toggle(oculto, v <= 0)` a cada quadro; com o mutirão pagando parcelas, um contador
           volta legitimamente a zero e o nicho sumiria no meio da partida. Hoje `recNaTela` só
           REVELA — quem esconde é este atributo no boot e o APAGAR MEU PROGRESSO. -->
      <span class="rec oculto"><canvas class="pd" id="pdFlor" width="26" height="26"></canvas><b id="nFlor">0</b></span>
      <span class="rec oculto"><canvas class="pd" id="pdAgua" width="26" height="26"></canvas><b id="nAgua">0</b></span>
      <span class="rec oculto"><canvas class="pd" id="pdRef" width="26" height="26"></canvas><b id="nRef">0</b></span>
    </div>
    <!-- owner: the third chip (world %) is gone — the top row is impact and team only. -->
  </div>
  </div>
  <!-- O nome do capítulo mora aqui, ao lado da barra que mede justamente ele. No chip de cima,
       espremido entre o impacto e os três contadores, "ANTES DA CHEGADA" cabia como
       "ANTES DA …" — nome cortado é pior que número.
       O botão de menu que o agente pôs aqui NÃO entra: ele já desceu para a barra de baixo,
       junto das outras ações. Dois botões de menu seria pior que nenhum. -->
  <div id="linhaEpoca">
    <span id="rotuloEpoca">ANTES DA CHEGADA</span>
    <div id="barraEpoca"><div id="barraEpocaFill"></div></div>
  </div>
  <!-- O sussurro da barra (usabilidade, achado 10): quando falta pouco para a era virar,
       esta linha acende embaixo da plaquinha. Preenchida por desenhar(), na fonte bitmap. -->
  <div id="sussurroEra"></div>
  <!-- O indicador do marco: quantos passos até a placa que já entrou na estrada (cap. 2).
       Discreto de propósito — mora sob a barra da época e só existe enquanto há marco vindo. -->
  <div id="marcoDist"></div>
</div>

<!-- a tira #offline do motor antigo saiu na passada da régua: nenhum código a preenchia,
     e o papel #retorno logo abaixo é quem faz esse trabalho desde JOGABILIDADE passo 3. -->

<!-- ENQUANTO VOCÊ ESTEVE FORA: o papel de campo que o lugar deixa para quem volta.
     Preenchido por mostrarRetorno() só com números da economia real; fecha num toque. -->
<!-- O véu do retorno (bug B1): IRMÃO do papel, nunca filho. Como filho ele teria de ter
     z-index negativo para ficar atrás, e nessa ordem ele pinta DEPOIS do fundo do próprio
     papel — o papel saía encardido, medido no primeiro print. Irmão em z 59 escurece só o
     que está atrás. -->
<div id="retVeu" aria-hidden="true"></div>
<div id="retorno" aria-hidden="true">
  <div id="retTit">ENQUANTO VOCÊ ESTEVE FORA</div>
  <div id="retLista"></div>
  <div id="retOk">toque para seguir ▾</div>
</div>

<!-- O guia de primeira partida foi apagado (usabilidade, achado 5). Quem ensina os
     controles são as microdicas contextuais, desenhadas pelo próprio jogo: o rótulo
     "ESQUERDA PULA" na cena e a seta #dicaSeta apontando o contador que encheu. -->
<div id="dicaSeta" aria-hidden="true"></div>

<!-- Four entries, four different jobs, and they used to be four identical slabs in a row.
     Now the block says what each one is: the RHYTHM you are running is a wide readout (it
     is the one decision this prototype exists to measure), the TORCH is a small keepsake
     button beside it, the two things you BUILD with are a stacked pair at the side, and
     the main action takes the whole rest of the block under your thumb. -->
<div id="controls">
  <div id="cartoes">
    <button id="modeQuick" class="cartao"><canvas class="pi" id="modeIcon" width="26" height="26"></canvas>
      <span class="cn" id="modeNome">CORRER</span></button>
    <div id="rail">
      <!-- A FOLHA, nao o Cetro. Decisao do dono (08/08): o icone da acao principal tem que
           ser "o mais facil que tem". O Cetro era desenho novo e bonito, mas pedia ser
           aprendido; a folha e o que o jogo ja usa no contador e a pessoa ja associa a
           ganhar. Icone de acao principal nao e lugar de introduzir vocabulario. -->
      <button id="btnClique"><canvas class="pi big" data-i="leaf" width="13" height="13"></canvas><span id="cliqueRotulo">+<span id="ganhoClique">1</span></span></button>
    </div>
    <button id="openUpgrades" class="cartao"><canvas class="pi" data-i="up" width="13" height="13"></canvas>
      <span class="cn">MELHORIAS</span></button>
    <!-- onda 7: MENU era o único cartão sem ícone — quebrava o ritmo ícone+rótulo da fileira -->
    <button class="cartao" id="abrirMenu" type="button"><canvas class="pi" data-i="menu" width="13" height="13"></canvas><span class="cn">MENU</span></button>
</div>
</div>

         tábua encurta a folga do poste em telas baixas — ver a média de altura no estilo.css. -->
    <button class="telaBtn sec" id="btnGlossario">GLOSSÁRIO</button>

         a mostrar DE ONDE VEM DUAS VEZES — a segunda em Arial Black, porque `pixelRotulo`
         pinta o primeiro nó com o id e o segundo ficava com o texto cru do molde. Achado no
         print `test/LG-antes-menu-zero.png`, não em teste nenhum: id repetido não dá erro. -->
    <!-- CONFIGURAÇÕES, e não mais AJUSTES (15/08, decisão do dono) — e DE ONDE VEM mudou-se
         para dentro dela na mesma decisão. Os dois motivos se somam: "configurações" é a palavra
         que todo aplicativo usa e ninguém precisa aprender, e a procedência é leitura de quem
         quer conferir, não porta de entrada. De quebra o poste volta a SETE tábuas: a oitava
         tinha acabado de obrigar a apertar o respiro de todas. -->
    <button class="telaBtn sec" id="btnConfig">CONFIGURAÇÕES</button>
  </div>
</div>

<!-- A FALA: a caixa de diálogo de jogo antigo. É por aqui que o contexto histórico chega —
     antes de jogar, não escondido numa tela de menu. O texto vive em EPOCAS, que carrega
     data e procedência, e não em TEXTOS, que é ficção autoral e não pode conter dígito. -->

<!-- CAPITULOS: o caminho de entrada do jogo. O dono pediu que sempre se comece pelo menu e
     que daqui se veja o que ja se abriu e o que falta — a lista de eras E o mapa do jogo. -->
<div class="tela" id="telaCapitulos">
  <div class="telaTit">ESCOLHA A ERA</div>
  <!-- O PAÍS ACIMA DA LISTA (16/08, decisão do dono): a lista continua sendo a escolha; o mapa
       é o corpo visual dela. Capítulos com lugar são pinos; PINDORAMA e AINDA AQUI são FAIXAS
       atravessando o país inteiro — porque é isso que os dois dizem (§2.1: fincar um pino
       diria que a história deles é de um lugar só). -->
  <canvas id="erasMapa" aria-hidden="true"></canvas>
  <div id="listaCapitulos"></div>
  <button class="telaBtn sec" id="btnVoltarCap">VOLTAR</button>
</div>

<div class="tela" id="telaFala">
  <!-- AS IMAGENS DE CONTEXTO. Sao DUAS e nao uma: e assim que o esmaecimento existe. Uma
       segura o que se ve, a outra recebe a proxima e sobe de opacidade por cima; na troca
       seguinte elas invertem os papeis. Uma <img> so obrigaria a trocar o src no meio da
       transicao, que e exatamente o corte seco que se quer evitar.
       Sem atributo src no molde de proposito: a guarda de arquivo unico do build recusa
       qualquer src que nao seja data:, e um src vazio pediria a pagina de novo. -->
  <img class="falaCtx" id="falaCtxA" alt="" aria-hidden="true">
  <img class="falaCtx" id="falaCtxB" alt="" aria-hidden="true">
  <!-- O retrato e IRMAO da caixa, nao filho. Como filho, mesmo com z-index negativo ele
       ficava na frente do fundo da caixa — dentro de um contexto de empilhamento, filho
       negativo pinta depois do fundo do pai. Fora dele, a caixa cobre de verdade. -->
  <img id="falaRetrato" alt="">
  <div id="falaCaixa">
    <button id="btnFalaPular" type="button">PULAR</button>
    <div id="falaCorpo">
      <div id="falaTit"></div>
      <div id="falaSub"></div>
      <div id="falaPalco">
        <div id="falaFantasma" aria-hidden="true"></div>
        <div id="falaTxt"></div>
      </div>
    </div>
    <div id="falaSeta">toque para continuar ▾</div>
  </div>
  <!-- A CERIMÔNIA: a primeira fala de uma era é um momento. O nome da era assenta grande na
       fonte bitmap sobre o mundo escurecido, o QUANDO acende embaixo, e só então a caixa
       sobe. O JS preenche e a classe .cerimoniando (no telaFala) rege tudo — ver estilo.css. -->
  <div id="cerimonia" aria-hidden="true">
    <div id="cerNome"></div>
    <div id="cerQuando"></div>
  </div>
</div>

<!-- COMPLETUDE: o que já foi visto. É o motivo de voltar amanhã. -->
<div class="tela" id="telaCompletude">
  <div class="telaTit">A HISTÓRIA</div>
  <div id="listaCenas"></div>
  <button class="telaBtn" id="btnVoltarComp">VOLTAR</button>
</div>

<!-- AJUSTES -->
<div class="tela" id="telaConfig">
  <div class="telaTit">CONFIGURAÇÕES</div>
  <div class="telaTxt" id="cfgInfo"></div>
  <!-- O interruptor do som. Primeiro botão da tela porque é o único ajuste que alguém procura
       com pressa — quem está no ônibus quer calar o jogo agora, não depois de ler. -->
  <button class="telaBtn sec" id="btnSom">SOM</button>
  <!-- O interruptor da contagem anônima (10/08). Ele não é enfeite de conformidade: a linha
       acima dele afirma o que sai do aparelho, e afirmação sem interruptor é aviso, não
       escolha. Desligado, `medir()` sai na primeira linha e não sai um byte. -->
  <button class="telaBtn sec" id="btnMedir">CONTAGEM</button>
  <!-- DE ONDE VEM, que morava no poste. Fica ANTES de apagar e depois dos interruptores:
       é leitura, não ajuste, mas é a leitura que sustenta tudo o que o jogo afirma — e num
       menu de configurações a procedência tem exatamente a mesma natureza da linha que diz o
       que sai do aparelho. As duas respondem "o que este jogo faz com a verdade". -->
  <button class="telaBtn sec" id="btnFontes">DE ONDE VEM</button>
  <button class="telaBtn sec" id="btnApagar">APAGAR MEU PROGRESSO</button>
  <button class="telaBtn" id="btnVoltarCfg">VOLTAR</button>
</div>

     O QA mediu: o fecho do último capítulo devolvia à mesma rua, barra em 100%, e daí em
     diante quarenta toques rendiam +56 e nada. O jogo acabava e não avisava.

     Não é uma tela de vitória, e a razão é o §2.1. O último capítulo se chama AINDA AQUI e
     existe para dizer que estes povos não são um estágio que a história superou — colocar
     "VOCÊ VENCEU" no fim de um jogo sobre invasão, escravidão e demarcação em curso seria
     desmentir o jogo inteiro na última tela. Não há troféu, não há pontuação e não há
     ranking: o que ela mostra é o que você LEU, o que DEIXOU PASSAR, e para onde ir.
     O impacto acumulado e os recursos ficam de fora de propósito — número de jogo virando
     placar de história é exatamente o que o §2 proíbe. -->
<div class="tela" id="telaFim">
  <div class="telaTit" id="fimTit">ATÉ AQUI</div>
  <div class="telaTxt" id="fimTxt"></div>
  <div id="fimPlacar"></div>
  <!-- A PERGUNTA DE UMA LINHA. O jogo existe para responder "o loop segura alguém por três
       dias?" e até aqui quem respondia era um bot. Ela vive DEPOIS do placar e ANTES das duas
       portas, e não é pedágio: quem sair sem tocar sai igual, e ela não volta a perguntar.
       Não é avaliação e não pode virar uma — nada de estrelas, nada de nota, nada de "gostou?".
       A CHEGADA não é troféu (§2.1) e uma caixa de nota no fim de um jogo sobre invasão e
       escravidão seria a mesma tela de vitória que três ondas tiraram daqui, com outra roupa.
       O material é o que já existe: papel de campo para a pergunta (PAPEL fala serifa) e
       tábua para as respostas (MADEIRA fala bitmap) — a régua da casa, sem vocabulário novo. -->
  <!-- O QUE FICA: três afirmações do jogo para CONFERIR — cada uma abre a resposta com a
     fonte. Não é prova: nada marca acerto, nada conta, e as palavras de avaliação são
     proibidas pelo encaixe 19. É a perna "ensina" da tese ganhando o único medidor que
     ela não tinha: se a pessoa toca, ela quer saber — e sai sabendo DE ONDE vem. -->
<div id="fimConfere"></div>
<div id="fimPergunta" class="oculto">
    <div id="fimPerguntaTxt"></div>
    <div id="fimPerguntaBotoes">
      <button class="telaBtn perguntaBtn" id="btnVolta1"></button>
      <button class="telaBtn perguntaBtn" id="btnVolta2"></button>
      <button class="telaBtn perguntaBtn" id="btnVolta3"></button>
    </div>
  </div>
  <button class="telaBtn" id="btnFimHist">A HISTÓRIA</button>
  <button class="telaBtn sec" id="btnFimFontes">DE ONDE VEM</button>
  <button class="telaBtn sec" id="btnFimVoltar">VOLTAR PARA A RUA</button>
</div>

<!-- O LUGAR: a obra do mutirão, num lugar que se VISITA.
     O dono viu a casa de pé na estrada e disse *"no jogo em si achei meio estranho… talvez
     algo no menu do jogo que vá evoluindo"*. Ele tem razão, e o diagnóstico é de LEITURA: na
     estrada a obra pronta lê como cenário — indistinguível da pintura de fundo. Quem a
     construiu não percebe que construiu, e uma coisa que ninguém vê que fez não dá vontade
     de voltar, que era o critério dele.

     Então a obra ganha página. Nenhum material novo e nenhuma imagem nova: é o caderno de
     campo da casa (papel de campo com pauta, moldura de madeira em dois tons), e o desenho
     de cada canteiro é a MESMA função que o desenha na rua, colada na página como a gravura
     de um caderno naturalista — a referência da onda 6 (Art of Fauna) aplicada ao que já
     existia. A lista inteira é montada por `montarObra()`: nada aqui é marcação escrita à
     mão, porque tudo depende do estado.

     §2, e esta tela é onde ele é mais fácil de trair: ela CONTA quem trabalha, nunca COMANDA.
     Não há uma acolhida tocável, arrastável ou alocável; não há "rende X por hora"; não há
     um dígito da obra em lugar nenhum — o progresso é o desenho, como na rua. -->
<div class="tela" id="telaObra">
  <div class="telaTit">O LUGAR</div>
  <div id="obraCorpo">
    <div id="obraNovo"></div>
    <div id="obraCanteiros"></div>
    <div id="obraGente"></div>
  </div>
  <button class="telaBtn" id="btnObraIr">IR ATÉ LÁ</button>
  <button class="telaBtn sec" id="btnVoltarObra">VOLTAR</button>
</div>

<!-- O MAPA. Pedido do dono em 2026-08-15: "seria legal ter um mapa interativo do Brasil para
     ver dados de cada estado". A forma foi decidida por ele no mesmo dia: mapa de PINOS,
     estilizado, sem fronteiras de estado — porque desenhar 27 fronteiras de memória é inventar
     geografia, e fronteira de palpite num jogo sobre história do Brasil é pior que não ter mapa.
     O contorno é desenhado em canvas, na mesma linguagem do resto: pixel, madeira e papel. -->
<div class="tela" id="telaMapa">
  <div class="telaTit">ONDE FOI</div>
  <canvas id="mapaCv" aria-label="Mapa do Brasil com os lugares dos capítulos"></canvas>
  <div id="mapaFicha"></div>
  <div id="mapaRodape"></div>
  <button class="telaBtn sec" id="btnVoltarMapa">VOLTAR</button>
</div>

<!-- FONTES: o §2 virando interface. Se alguém inventar um fato, esta tela fica vazia. -->
<div class="tela" id="telaFontes">
  <div class="telaTit">DE ONDE VEM</div>
  <div id="listaFontes"></div>
  <button class="telaBtn" id="btnVoltarFontes">VOLTAR</button>
</div>

<!-- GLOSSÁRIO: o dicionário de campo do jogo. Pedido do dono (2026-08-08): "explicar todos os
     termos que a gente usa no jogo, ou na história — pra dar contexto, e de onde vem".
     A lista é preenchida por JS (o Dev), NUNCA por marcação escrita aqui: quem escreve verbete
     escreve com fonte, e fonte mora no código junto do texto. As classes que a Direção de Arte
     estiliza estão no estilo.css, na seção GLOSSÁRIO. -->
<!-- A LISTA É DE TERMOS RECOLHIDOS, e o verbete abre ao toque (decisão do dono, 2026-08-08).
     Antes eram 52 cartões abertos empilhados: dois enchiam a tela e nada ficava na cabeça.
     Recolhida, a lista mostra o campo inteiro antes de a pessoa escolher onde entrar.
     A DIVISÃO DE TRABALHO: o Dev monta o DOM inteiro e só alterna a classe `.aberto` no
     toque; QUEM DECIDE o que aparece recolhido e o que aparece aberto é a CSS. Nenhuma
     altura é calculada em JS — nem aqui, nem no rolo (ver #listaGlossario no estilo.css).
     A ORDEM DA COLUNA é o que faz a barra de busca e as abas NÃO rolarem com a lista: o
     `.tela` é um flex vertical, e só `#listaGlossario` tem `flex: 1 1 auto; min-height: 0`. -->
<div class="tela" id="telaGlossario">
  <div class="telaTit">GLOSSÁRIO</div>
  <!-- O PRIMEIRO <input> DO JOGO. Duas armadilhas, e as duas moram no estilo.css:
       1. a régua §3.4 é "sem zoom, sem seleção de texto", e o `user-select: none` global do
          `*` impede EDITAR o que se digitou — o campo é isentado por regra própria;
       2. `font-size` abaixo de 16 px faz o Safari do iPhone dar zoom ao focar e desmontar a
          tela; o corpo do campo é o degrau 17,2 da escala, que passa dos 16 com folga. -->
  <div id="glBusca">
    <input id="glCampo" type="text" inputmode="search" autocomplete="off"
           autocorrect="off" spellcheck="false" placeholder="buscar termo">
    <button id="glLimpar" type="button" aria-label="limpar busca">✕</button>
    <!-- O DADO. Era um "?", e um "?" ao lado de um campo de busca promete AJUDA ("como isto
         funciona") — não "me mostra um termo qualquer", que é o que o botão faz. O dado não
         precisa de tradução e não promete outra coisa. Ele é desenhado no estilo.css, em
         quadrados de aresta dura sobre a pedra da tecla: sem glifo (a face de dado do Unicode
         cai numa fonte de símbolo que não é da casa) e sem imagem nova (peso zero).
         O rótulo de verdade continua no `aria-label`, que já dizia a coisa certa. -->
    <button id="glSorte" type="button" aria-label="mostrar um verbete ao acaso"></button>
  </div>
  <!-- As abas saem do próprio conteúdo (o Dev as pinta a partir dos grupos do GLOSSARIO).
       Sete não cabem em 375 px: a fileira rola na horizontal e as bordas dissolvem, que é o
       mesmo recurso do rolo vertical da lista — a casa já tem essa frase. -->
  <div id="glFiltros"></div>
  <div id="listaGlossario"></div>
  <button class="telaBtn" id="btnVoltarGloss">VOLTAR</button>
</div>

<div class="sheet" id="sheetUpgrades">
  <div class="sheetHead"><div class="t">MELHORIAS</div>
    </div>
  <div id="listaUp">
    <div class="upgrade" id="cardU1"><span class="nome">×3<br>por alcance</span><button id="btnU1"></button></div>
    <div class="upgrade" id="cardU2"><span class="nome">×2<br>no que pega</span><button id="btnU2"></button></div>
    <div class="upgrade" id="cardU3"><span class="nome">2/s<br>sozinhos</span><button id="btnU3"></button></div>
    <!-- Ferramentas de TESTE, escondidas do jogador: um x100 GRÁTIS na loja quebrava a
         economia num toque, e APAGAR ficava ao alcance do dedão (usabilidade, achado 4).
         O smoke test continua acionando-as via .click() — display:none não bloqueia. -->
    <!-- O x100 VOLTA, a pedido do dono (08/08): "pra poder jogar o jogo mais rápido".
           Eu o havia escondido na revisão de usabilidade porque um jogador desavisado
           quebra a economia num toque — a preocupação continua válida e continua
           registrada, mas quem decide o que está na tela dele é ele. O que fiz para
           não perder a medição junto: usar o x100 MARCA a sessão em R.turbo, e a tela
           de retenção passa a dizer quantos dias tiveram turbo. Dado com asterisco vale
           mais que dado limpo e falso. -->
      <!-- NASCE OCULTA, e a razão é o QA dos cinco minutos: ela é GRÁTIS e estava visível no
           segundo zero. O bot curioso comprou aos 20,2 s, o botão dourado passou a +300,0 e
           ele liquidou PINDORAMA aos 76 s — o jogo inteiro trivializado antes de a pessoa
           entender o que ele é. O dono a pediu de volta para poder testar depressa, e ela
           continua ali para isso: aparece assim que o impacto acumulado alcança o preço da
           PRIMEIRA melhoria de verdade (150). Quem segura o botão chega lá em segundos —
           quem está aprendendo chega depois de ter entendido o laço. Ver `revelarTurbo()`. -->
      <div class="upgrade teste oculta" id="cardU4"><span class="nome">×100<br>RÁPIDO</span><button id="btnU4"></button></div>
    <div class="upgrade teste oculta" id="cardU5"><span class="nome">ZERAR<br>TEST</span><button id="btnU5">apagar</button></div>
  </div>
</div>
